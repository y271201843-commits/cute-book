<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>喵喵记账</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  background-color: #fff0f6;
  padding-bottom: 90px;
  color: #333;
}

/* 顶部栏 */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: #fff0f6;
  padding: 20px 20px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.topbar-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 24px;
  font-weight: 800;
  color: #4b2e3b;
}

.cat-logo{
  font-size:30px;
}

.voice-icon {
  width:44px;
  height:44px;
  border-radius: 50%;
  background: #ffffff;
  box-shadow:0 3px 10px #00000010;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  cursor:pointer;
}

/* 备注输入框 */
.remark-input-wrap{
  margin:14px 20px 22px;
  background:#ffffff;
  border-radius:22px;
  padding:16px 18px;
  display:flex;
  gap:10px;
  align-items:center;
  box-shadow:0 4px 14px #00000008;
}
.pen-icon{
  font-size:20px;
}
#topRemark{
  flex:1;
  border:none;
  outline:none;
  font-size:17px;
  background:transparent;
}

.section-title{
  padding:0 20px 12px;
  display:flex;
  justify-content:space-between;
  color:#4b2e3b;
  font-weight:700;
  font-size:18px;
}
.section-title .tip{
  color:#998890;
  font-weight:normal;
  font-size:14px;
}

/* 分类网格，4列布局，和截图完全一致 */
.cate-grid{
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap:16px;
  padding:0 20px 30px;
}
.cate-item{
  background:#ffffff;
  border-radius:24px;
  padding:20px 8px 12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  box-shadow:0 3px 10px #00000007;
  cursor:pointer;
  border:3px solid transparent;
  transition: transform 0.15s ease, border-color 0.2s;
}
/* ✨点击缩放动画，可爱按压效果 */
.cate-item:active{
  transform:scale(0.94);
}
.cate-item.selected{
  border-color:#ff87ad;
}
.cate-icon{
  font-size:42px;
}
.cate-name{
  font-size:14px;
  color:#55444c;
}

/* 快捷备注区 */
.fast-grid{
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap:16px;
  padding:0 20px 24px;
}
.fast-item{
  background:#ffffff;
  border-radius:24px;
  padding:18px 6px 10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  box-shadow:0 3px 10px #00000007;
  cursor:pointer;
  transition: transform 0.15s ease;
}
.fast-item:active{
  transform:scale(0.94);
}
.fast-icon{
  font-size:38px;
}
.fast-name{
  font-size:14px;
  color:#55444c;
}

/* 页面切换 */
.page { display: none; }
.page.active { display: block; }

/* 明细页面 */
.list-page-wrap{
  padding:16px 20px;
}
.export-btn{
  width:100%;
  padding:14px;
  background:#ff8fab;
  color:white;
  border-radius:14px;
  text-align:center;
  font-weight:700;
  margin-bottom:16px;
  cursor:pointer;
}
.rec-item {
  display: flex;
  justify-content: space-between;
  padding: 13px 0;
  border-bottom: 1px solid #f0f0f0;
}
.rec-item:last-child { border-bottom: none; }
.rec-title { font-weight: 700; }
.rec-sub { font-size: 12px; color: #999; margin-top: 4px; }
.rec-amt-out { color: #ff6b6b; font-weight: 800; }
.rec-amt-in { color: #28b968; font-weight: 800; }

/* 底部tab导航【和截图一模一样：记一笔 /日历 /备忘录 /我的】 */
.tab-bar {
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  background:#ffffff;
  border-top:1px solid #eee;
  padding-bottom: env(safe-area-inset-bottom);
}
.tab {
  flex:1;
  text-align:center;
  padding:12px 0;
  font-size:13px;
  cursor:pointer;
  color:#888;
}
.tab.active{
  color:#ff6b8b;
}
.tab-icon{
  font-size:24px;
  display:block;
  margin-bottom:4px;
}

#toast {
  position:fixed;
  left:50%;
  bottom:120px;
  transform:translate(-50%, 20px);
  background:rgba(45,42,50,.92);
  color:#fff;
  padding:10px 16px;
  border-radius:999px;
  font-size:13px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:200;
}
#toast.show { opacity:1; transform:translate(-50%, 0); }
</style>
</head>
<body>

<!-- 记一笔页面 -->
<div id="page-add" class="page active">
  <div class="topbar">
    <div class="topbar-title">
      <span class="cat-logo">🐱</span>
      记一笔
    </div>
    <div class="voice-icon">🔊</div>
  </div>

  <div class="remark-input-wrap">
    <span class="pen-icon">✏️</span>
    <input id="topRemark" placeholder="火锅，打车">
  </div>

  <div class="section-title">
    <span>选择分类</span>
    <span class="tip">点一个对应萌宠</span>
  </div>
  <div class="cate-grid" id="cateContainer"></div>

  <div class="section-title">
    <span>快捷备注</span>
    <span class="tip">点了也能继续改文字</span>
  </div>
  <div class="fast-grid" id="fastContainer"></div>

</div>

<!-- 账单明细页面（导出按钮） -->
<div id="page-list" class="page">
  <div class="topbar">
    <div class="topbar-title">账单明细</div>
  </div>
  <div class="list-page-wrap">
    <div class="export-btn" onclick="exportBill()">📄 导出全部账单</div>
    <div id="recordList"></div>
  </div>
</div>

<!-- 统计页面 -->
<div id="page-stats" class="page">
  <div class="topbar">
    <div class="topbar-title">数据统计</div>
  </div>
  <div class="list-page-wrap">
    <div style="background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;">
      <div style="font-size:14px;color:#888;margin-bottom:8px;">累计支出</div>
      <div style="font-size:32px;font-weight:800;color:#ff6b6b;" id="statExp">¥0.00</div>
    </div>
    <div style="background:#fff;border-radius:16px;padding:20px;">
      <div style="font-size:14px;color:#888;margin-bottom:8px;">累计收入</div>
      <div style="font-size:32px;font-weight:800;color:#28b968;" id="statInc">¥0.00</div>
    </div>
  </div>
</div>

<!-- 底部导航完全还原截图 -->
<div class="tab-bar">
  <div class="tab active" onclick="switchPage('add', this)">
    <span class="tab-icon">🖊️</span>记一笔
  </div>
  <div class="tab" onclick="switchPage('list', this)">
    <span class="tab-icon">🗓️</span>日历
  </div>
  <div class="tab" onclick="switchPage('stats', this)">
    <span class="tab-icon">📝</span>备忘录
  </div>
  <div class="tab">
    <span class="tab-icon">👤</span>我的
  </div>
</div>

<div id="toast"></div>

<script>
let records = JSON.parse(localStorage.getItem('myRecords')) || [];
let currentCate = "饮品";

// ✅ 和截图一一对应的可爱图标！！
const cateList = [
  {name:"餐饮",icon:"🍔"},
  {name:"饮品",icon:"☕"},
  {name:"交通",icon:"🚕"},
  {name:"购物",icon:"🛍️"},
  {name:"居住",icon:"🏠"},
  {name:"娱乐",icon:"🎮"},
  {name:"学习",icon:"📖"},
  {name:"医疗",icon:"❓"},
  {name:"人情",icon:"🎁"},
  {name:"宠物",icon:"🐈"},
  {name:"护肤",icon:"💄"},
  {name:"其他",icon:"•••"}
];

const fastList = [
  {name:"早餐",icon:"🌅🍲"},
  {name:"午餐",icon:"☀️🍜"},
  {name:"晚餐",icon:"🌙🍲"},
  {name:"火锅",icon:"❓"}
];

function $(id){return document.getElementById(id);}

//渲染分类【修复点击选中BUG！】
function renderCate(){
  $('cateContainer').innerHTML = cateList.map(item=>`
    <div class="cate-item ${item.name===currentCate?'selected':''}" onclick="selectCate('${item.name}')">
      <div class="cate-icon">${item.icon}</div>
      <div class="cate-name">${item.name}</div>
    </div>
  `).join('');
}
function selectCate(name){
  currentCate = name;
  renderCate();
}

//快捷备注渲染
function renderFast(){
  $('fastContainer').innerHTML = fastList.map(item=>`
    <div class="fast-item" onclick="applyFastNote('${item.name}')">
      <div class="fast-icon">${item.icon}</div>
      <div class="fast-name">${item.name}</div>
    </div>
  `).join('');
}
function applyFastNote(text){
  $('topRemark').value = text;
}

//页面切换
function switchPage(pageName,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  $('page-'+pageName).classList.add('active');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(el) el.classList.add('active');
  if(pageName==='list') renderList();
  if(pageName==='stats') renderStats();
}

//账单渲染
function renderList(){
  if(records.length ===0){
    $('recordList').innerHTML = '<div style="text-align:center;color:#999;padding:20px;">暂无账单记录</div>';
    return;
  }
  $('recordList').innerHTML = records.slice().reverse().map(r=>`
    <div class="rec-item">
      <div>
        <div class="rec-title">${r.category}</div>
        <div class="rec-sub">${r.date} ${r.note ? '· ' + r.note : ''}</div>
      </div>
      <div class="${r.type==='exp'?'rec-amt-out':'rec-amt-in'}">${r.type==='exp'?'-':'+'}¥${r.amount.toFixed(2)}</div>
    </div>
  `).join('');
}

//统计页面
function renderStats(){
  const totalExp = records.filter(r=>r.type==='exp').reduce((s,r)=>s+r.amount,0);
  const totalInc = records.filter(r=>r.type==='inc').reduce((s,r)=>s+r.amount,0);
  $('statExp').textContent = '¥' + totalExp.toFixed(2);
  $('statInc').textContent = '¥' + totalInc.toFixed(2);
}

//导出账单CSV功能
function exportBill(){
  if(records.length === 0){
    showToast('暂无账单可以导出');
    return;
  }
  const header = ["日期","收支类型","分类","金额","备注"];
  const rows = records.map(r=>{
    const typeText = r.type === 'exp' ? '支出' : '收入';
    return [r.date, typeText, r.category, r.amount, r.note];
  })
  let csvContent = "\uFEFF";
  csvContent += header.join(",") + "\n";
  rows.forEach(row=>{
    csvContent += row.join(",") + "\n";
  })
  const blob = new Blob([csvContent], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `喵喵记账账单_${new Date().toLocaleDateString()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('账单文件已下载');
}

function showToast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1600);
}

//初始化渲染
renderCate();
renderFast();
</script>
</body>
</html>
