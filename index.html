<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>温馨记账</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  background-color: #fff7fb;
  padding-bottom: 90px;
  color: #333;
}

/* 顶部栏 */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: #fff7fb;
  padding: 20px 20px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.topbar-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 22px;
  font-weight: 800;
  color: #4b2e3b;
}

.home-icon {
  width: 28px;
  height: 28px;
  animation: breathe 2.6s ease-in-out infinite;
}

.voice-icon {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 4px 14px rgba(255, 182, 193, .2);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.voice-icon svg {
  width: 20px;
  height: 20px;
  animation: bounce 1.8s ease-in-out infinite;
}

/* 备注输入 */
.remark-input-wrap {
  margin: 14px 20px 22px;
  background: #ffffff;
  border-radius: 22px;
  padding: 16px 18px;
  display: flex;
  gap: 10px;
  align-items: center;
  box-shadow: 0 6px 20px rgba(255, 182, 193, .12);
}

.pen-icon {
  width: 22px;
  height: 22px;
  animation: breathe 2.4s ease-in-out infinite;
}

#topRemark {
  flex: 1;
  border: none;
  outline: none;
  font-size: 16px;
  background: transparent;
  color: #4b2e3b;
}

.section-title {
  padding: 0 20px 12px;
  display: flex;
  justify-content: space-between;
  color: #4b2e3b;
  font-weight: 800;
  font-size: 16px;
}

.section-title .tip {
  color: #b3929f;
  font-weight: 700;
  font-size: 12px;
}

/* 分类网格 */
.cate-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  padding: 0 20px 28px;
}

.cate-item {
  background: #ffffff;
  border-radius: 22px;
  padding: 18px 8px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  box-shadow: 0 6px 20px rgba(255, 182, 193, .12);
  cursor: pointer;
  border: 3px solid transparent;
  transition: .2s;
}

.cate-item:active {
  transform: scale(.94);
}

.cate-item.selected {
  border-color: #ff8fab;
  background: #fff0f6;
}

.cate-icon {
  width: 46px;
  height: 46px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: float 3s ease-in-out infinite;
  transition: .25s;
}

.cate-item.selected .cate-icon {
  animation: pop .4s ease;
  transform: scale(1.12);
}

.cate-icon svg {
  width: 26px;
  height: 26px;
}

.cate-name {
  font-size: 13px;
  color: #55444c;
  font-weight: 800;
}

/* 快捷备注 */
.fast-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  padding: 0 20px 24px;
}

.fast-item {
  background: #ffffff;
  border-radius: 22px;
  padding: 16px 6px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  box-shadow: 0 6px 20px rgba(255, 182, 193, .12);
  cursor: pointer;
  transition: .2s;
}

.fast-item:active {
  transform: scale(.94);
}

.fast-icon {
  width: 40px;
  height: 40px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: float 3.2s ease-in-out infinite;
}

.fast-icon svg {
  width: 24px;
  height: 24px;
}

.fast-name {
  font-size: 13px;
  color: #55444c;
  font-weight: 800;
}

/* 页面切换 */
.page { display: none; }
.page.active { display: block; }

/* 明细页 */
.list-page-wrap {
  padding: 16px 20px;
}

.export-btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #ffb6c1, #ff8fab);
  color: white;
  border-radius: 16px;
  text-align: center;
  font-weight: 800;
  margin-bottom: 16px;
  cursor: pointer;
  box-shadow: 0 10px 24px rgba(255, 143, 171, .25);
}

.rec-item {
  display: flex;
  justify-content: space-between;
  padding: 13px 0;
  border-bottom: 1px solid #f0f0f0;
}

.rec-item:last-child { border-bottom: none; }
.rec-title { font-weight: 800; }
.rec-sub { font-size: 12px; color: #999; margin-top: 4px; }
.rec-amt-out { color: #ff6b6b; font-weight: 800; }
.rec-amt-in { color: #28b968; font-weight: 800; }

/* 我的页 */
.my-page-wrap {
  padding: 20px;
}

.my-card {
  background: #fff;
  border-radius: 24px;
  padding: 26px;
  text-align: center;
  box-shadow: 0 10px 24px rgba(255, 182, 193, .12);
}

.my-avatar {
  width: 70px;
  height: 70px;
  margin: 0 auto 14px;
  animation: breathe 2.6s ease-in-out infinite;
}

/* 底部导航 */
.tab-bar {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  background: rgba(255, 255, 255, .96);
  backdrop-filter: blur(20px);
  border-top: 1px solid #ffe4ec;
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 999;
}

.tab {
  flex: 1;
  text-align: center;
  padding: 11px 0;
  font-size: 12px;
  cursor: pointer;
  color: #b3929f;
  font-weight: 800;
}

.tab.active {
  color: #ff6b8b;
}

.tab-icon {
  width: 22px;
  height: 22px;
  margin: 0 auto 3px;
  display: block;
}

/* 动效 */
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

@keyframes breathe {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}

@keyframes pop {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.16); }
}

/* Toast */
#toast {
  position: fixed;
  left: 50%;
  bottom: 120px;
  transform: translate(-50%, 20px);
  background: rgba(45, 42, 50, .92);
  color: #fff;
  padding: 10px 16px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  opacity: 0;
  pointer-events: none;
  transition: .25s;
  z-index: 200;
}

#toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}
</style>
</head>
<body>

<!-- 记一笔页面 -->
<div id="page-add" class="page active">
  <div class="topbar">
    <div class="topbar-title">
      <svg class="home-icon" viewBox="0 0 24 24" fill="#ff8fab">
        <path d="M12 2 4 9v11h16V9l-8-7Z"/>
      </svg>
      记一笔
    </div>
    <div class="voice-icon" onclick="showToast('音效已开启')">
      <svg viewBox="0 0 24 24" fill="#ff8fab">
        <path d="M11 5 6 9H3v6h3l5 4V5Z"/>
        <path d="M15.5 8.5a5 5 0 0 1 0 7" stroke="#ff8fab" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <div class="remark-input-wrap">
    <svg class="pen-icon" viewBox="0 0 24 24" fill="#ff94b8">
      <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25Z"/>
    </svg>
    <input id="topRemark" placeholder="火锅，打车">
  </div>

  <div class="section-title">
    <span>选择分类</span>
    <span class="tip">点一个对应图标</span>
  </div>
  <div class="cate-grid" id="cateContainer"></div>

  <div class="section-title">
    <span>快捷备注</span>
    <span class="tip">点了也能继续改文字</span>
  </div>
  <div class="fast-grid" id="fastContainer"></div>
</div>

<!-- 日历页面 -->
<div id="page-list" class="page">
  <div class="topbar">
    <div class="topbar-title">日历</div>
  </div>
  <div class="list-page-wrap">
    <div class="export-btn" onclick="exportBill()">导出全部账单</div>
    <div id="recordList"></div>
  </div>
</div>

<!-- 备忘录页面 -->
<div id="page-stats" class="page">
  <div class="topbar">
    <div class="topbar-title">备忘录</div>
  </div>
  <div class="list-page-wrap">
    <div style="background:#fff;border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 6px 20px rgba(255,182,193,.12);">
      <div style="font-size:14px;color:#888;margin-bottom:8px;">累计支出</div>
      <div style="font-size:32px;font-weight:800;color:#ff6b6b;" id="statExp">¥0.00</div>
    </div>
    <div style="background:#fff;border-radius:20px;padding:20px;box-shadow:0 6px 20px rgba(255,182,193,.12);">
      <div style="font-size:14px;color:#888;margin-bottom:8px;">累计收入</div>
      <div style="font-size:32px;font-weight:800;color:#28b968;" id="statInc">¥0.00</div>
    </div>
  </div>
</div>

<!-- 我的页面 -->
<div id="page-my" class="page">
  <div class="topbar">
    <div class="topbar-title">我的</div>
  </div>
  <div class="my-page-wrap">
    <div class="my-card">
      <svg class="my-avatar" viewBox="0 0 24 24" fill="#ffb6c1">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 21a8 8 0 0 1 16 0"/>
      </svg>
      <div style="font-size:18px;font-weight:800;margin-bottom:8px;color:#4b2e3b;">温馨记账用户</div>
      <div style="font-size:14px;color:#b3929f;">记录每一天的小开销</div>
    </div>
  </div>
</div>

<!-- 底部导航 -->
<div class="tab-bar">
  <div class="tab active" onclick="switchPage('add', this)">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25Z"/></svg>
    记一笔
  </div>
  <div class="tab" onclick="switchPage('list', this)">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.6"/></svg>
    日历
  </div>
  <div class="tab" onclick="switchPage('stats', this)">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16v16H4z"/><path d="M8 14l3 3 5-6" stroke="#fff" stroke-width="1.6"/></svg>
    备忘录
  </div>
  <div class="tab" onclick="switchPage('my', this)">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
    我的
  </div>
</div>

<div id="toast"></div>

<script>
let records = JSON.parse(localStorage.getItem('myRecords')) || [];
let currentCate = "餐饮";

// 自己设计的温馨卡通 SVG 图标，不再使用微信图标
const cateList = [
  {
    name: "餐饮",
    bg: "#FFD93D",
    svg: `<svg viewBox="0 0 24 24" fill="#fff"><path d="M6 4h12v10a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V4Z"/><path d="M6 9h12" stroke="#FFD93D" stroke-width="1.6"/></svg>`
  },
  {
    name: "饮品",
    bg: "#FFB6C1",
    svg: `<svg viewBox="0 0 24 24" fill="#fff"><path d="M7 4h10l-1 14a3 3 0 0 1-3 3h-2a3 3 0 0 1-3-3L7 4Z"/><path d="M5 4h14" stroke="#FFB6C1" stroke-width="1.6"/></svg>`
  },
  {
    name: "交通",
    bg: "#6EC1FF",
    svg: `<svg viewBox="0 0 24 24" fill="#fff"><path d="M3 13 5 8a2 2 0 0 1 2-1h10a2 2 0 0 1 2 1l2 5v4H3v-4Z"/><circle cx="7.5" cy="16" r="1.5" fill="#6EC1FF"/><circle cx="16.5" cy="16" r="1.5" fill="#6EC1FF"/></svg>`
  },
  {
    name: "购物",
    bg: "#8BE57A",
    svg: `<svg viewBox="0 0 24 24" fill="#fff"><path d="M4 7h16l-1 12H5L4 7Z"/><path d="M4 7h16" stroke="#8BE57A" stroke-width="1.6"/><path d="M9 12h6" stroke="#8BE57A" stroke-width="1.6"/></svg>`
  },
  {
    name: "居住",
    bg: "#FFB1B1",
    svg: `<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 4 4 11v9h16v-9l-8-7Z"/></svg>`
  },
  {
    name: "娱乐",
    bg: "#D98BFF",
    svg: `<svg viewBox="0 0 24 24" fill="#fff"><rect x="3" y="7" width="18" height="11" rx="3"/><circle cx="9" cy="12.5" r="1" fill="#D98BFF"/><circle cx="15" cy="12.5" r="1" fill="#D98BFF"/></svg>`
  },
  {
    name: "学习",
    bg: "#7ED0F7",
    svg: `<svg viewBox="0 0 24 24" fill="#fff"><path d="M4 4h11a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4V4Z"/></svg>`
  },
  {
    name: "医疗",
    bg: "#FFB1B1",
    svg: `<svg viewBox="0 0 24 24" fill="#fff"><path d="M4 12h16v5a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-5Z"/><path d="M9 9h6v3H9z" fill="#FFB1B1"/></svg>`
  },
  {
    name: "人情",
    bg: "#FFD93D",
    svg: `<svg viewBox="0 0 24 24" fill="#fff"><path d="M4 7h16v11H4V7Z"/><path d="M4 12h16" stroke="#FFD93D" stroke-width="1.6"/><path d="M4 7l8 5 8-5" stroke="#FFD93D" stroke-width="1.6"/></svg>`
  },
  {
    name: "宠物",
    bg: "#FFB1B1",
    svg: `<svg viewBox="0 0 24 24" fill="#fff"><path d="M6 10c0-2 2-4 4-4h4c2 0 4 2 4 4v7H6v-7Z"/><circle cx="9" cy="13" r="1" fill="#FFB1B1"/><circle cx="15" cy="13" r="1" fill="#FFB1B1"/></svg>`
  },
  {
    name: "护肤",
    bg: "#FFB6C1",
    svg: `<svg viewBox="0 0 24 24" fill="#fff"><path d="M9 4h6l-1 7h-4L9 4Z"/><path d="M7 13h10v4a4 4 0 0 1-4 4h-2a4 4 0 0 1-4-4v-4Z" fill="#FFC6E1"/></svg>`
  },
  {
    name: "其他",
    bg: "#C9C9C9",
    svg: `<svg viewBox="0 0 24 24" fill="#fff"><circle cx="7" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="17" cy="12" r="1.8"/></svg>`
  }
];

const fastList = [
  {
    name: "早餐",
    bg: "#FFD93D",
    svg: `<svg viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="13" r="5"/><path d="M6 13H3M21 13h-3" stroke="#FFD93D" stroke-width="1.6"/></svg>`
  },
  {
    name: "午餐",
    bg: "#FFB1B1",
    svg: `<svg viewBox="0 0 24 24" fill="#fff"><rect x="4" y="7" width="16" height="11" rx="2"/><path d="M8 11h8M8 15h5" stroke="#FFB1B1" stroke-width="1.6"/></svg>`
  },
  {
    name: "晚餐",
    bg: "#8BB5FF",
    svg: `<svg viewBox="0 0 24 24" fill="#fff"><path d="M6 13a6 6 0 0 1 12 0"/><path d="M5 17h14" stroke="#fff" stroke-width="1.6"/></svg>`
  },
  {
    name: "火锅",
    bg: "#FF8FB1",
    svg: `<svg viewBox="0 0 24 24" fill="#fff"><path d="M4 9h16v9H4V9Z"/><path d="M4 14h16" stroke="#FF8FB1" stroke-width="1.6"/></svg>`
  }
];

function $(id) { return document.getElementById(id); }

function renderCate() {
  $('cateContainer').innerHTML = cateList.map(item => `
    <div class="cate-item ${item.name === currentCate ? 'selected' : ''}" onclick="selectCate('${item.name}')">
      <div class="cate-icon" style="background:${item.bg}">${item.svg}</div>
      <div class="cate-name">${item.name}</div>
    </div>
  `).join('');
}

function selectCate(name) {
  currentCate = name;
  renderCate();
}

function renderFast() {
  $('fastContainer').innerHTML = fastList.map(item => `
    <div class="fast-item" onclick="applyFast('${item.name}')">
      <div class="fast-icon" style="background:${item.bg}">${item.svg}</div>
      <div class="fast-name">${item.name}</div>
    </div>
  `).join('');
}

function applyFast(name) {
  $('topRemark').value = name;
}

function switchPage(pageName, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  $('page-' + pageName).classList.add('active');
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  if (el) el.classList.add('active');
  window.scrollTo(0, 0);
  if (pageName === 'list') renderList();
  if (pageName === 'stats') renderStats();
}

function renderList() {
  if (records.length === 0) {
    $('recordList').innerHTML = '<div style="text-align:center;color:#b3929f;padding:20px;">暂无账单记录</div>';
    return;
  }
  $('recordList').innerHTML = records.slice().reverse().map(r => `
    <div class="rec-item">
      <div>
        <div class="rec-title">${r.category}</div>
        <div class="rec-sub">${r.date} ${r.note ? '· ' + r.note : ''}</div>
      </div>
      <div class="${r.type === 'exp' ? 'rec-amt-out' : 'rec-amt-in'}">${r.type === 'exp' ? '-' : '+'}¥${r.amount.toFixed(2)}</div>
    </div>
  `).join('');
}

function renderStats() {
  const totalExp = records.filter(r => r.type === 'exp').reduce((s, r) => s + r.amount, 0);
  const totalInc = records.filter(r => r.type === 'inc').reduce((s, r) => s + r.amount, 0);
  $('statExp').textContent = '¥' + totalExp.toFixed(2);
  $('statInc').textContent = '¥' + totalInc.toFixed(2);
}

function exportBill() {
  if (records.length === 0) {
    showToast('暂无账单可导出');
    return;
  }

  const header = ['日期', '类型', '分类', '金额', '备注'];
  const rows = records.map(r => [
    r.date,
    r.type === 'exp' ? '支出' : '收入',
    r.category,
    r.amount,
    r.note
  ]);

  let csv = '\uFEFF' + header.join(',') + '\n';
  rows.forEach(row => {
    csv += row.join(',') + '\n';
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;

  // 改文件名：不再出现“喵喵记账”
  a.download = `账单明细_${new Date().toLocaleDateString()}.csv`;
  a.click();

  URL.revokeObjectURL(url);
  showToast('已导出');
}

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1400);
}

renderCate();
renderFast();
</script>

</body>
</html>
