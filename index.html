<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffb6c1">

<!-- ========== 防浏览器长期缓存 ========== -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />

<!-- ========== PWA配置 ========== -->
<meta name="apple-mobile-web-app-title" content="松鼠记账">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">

<title>松鼠记账</title>
<style>
:root{
  --bg:#fff5f8;
  --card:#fff;
  --text:#5a3d4a;
  --sub:#b3929f;
  --line:#ffe4e9;
  --primary:#ff8fab;
  --primary-soft:#fff0f5;
  --green:#34d399;
  --red:#f87171;
  --orange:#fbbf24;
  --pink:#ff7aa2;
  --radius:26px;
  --radius-sm:18px;
  --shadow:0 10px 30px rgba(255,143,171,.15);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:16px;
  padding-bottom:100px;
}
.header{
  text-align:center;
  margin-bottom:20px;
}
.header h1{
  font-size:24px;
  color:var(--primary);
}
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
  margin-bottom:16px;
}
.item-row{
  margin-bottom:12px;
}
label{
  display:block;
  margin-bottom:6px;
  font-size:14px;
}
input,select{
  width:100%;
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  font-size:16px;
  background:#fff;
}
.btn{
  width:100%;
  border:none;
  background:var(--primary);
  color:white;
  padding:14px;
  border-radius:14px;
  font-size:17px;
  margin-top:10px;
}
.record-item{
  padding:12px 0;
  border-bottom:1px solid var(--line);
}
.money-out{
  color:var(--red);
}
.money-in{
  color:var(--green);
}
.bottom-bar{
  position:fixed;
  left:0;
  bottom:0;
  width:100%;
  background:#fff;
  display:flex;
  justify-content:space-around;
  padding:12px 0;
  border-top:1px solid var(--line);
}
.tab{
  font-size:14px;
  color:var(--sub);
}
.tab.active{
  color:var(--primary);
  font-weight:bold;
}
</style>
</head>
<body>
<div class="header">
  <h1>🐿️ 松鼠记账</h1>
</div>

<div class="card">
  <div class="item-row">
    <label>类型</label>
    <select id="typeSel">
      <option value="out">支出</option>
      <option value="in">收入</option>
    </select>
  </div>
  <div class="item-row">
    <label>金额</label>
    <input type="number" id="moneyInput" placeholder="输入金额">
  </div>
  <div class="item-row">
    <label>备注</label>
    <input type="text" id="noteInput" placeholder="例如：买菜、工资">
  </div>
  <button class="btn" onclick="addRecord()">添加记录</button>
</div>

<div class="card">
  <h3>账单列表</h3>
  <div id="recordList"></div>
</div>

<div class="bottom-bar">
  <div class="tab active">记账</div>
  <div class="tab">统计</div>
  <div class="tab">设置</div>
</div>

<script>
// 本地存储账单
let recordList = JSON.parse(localStorage.getItem("squirrelBill")) || [];

function render(){
  const wrap = document.getElementById("recordList");
  wrap.innerHTML = "";
  recordList.forEach(item=>{
    const div = document.createElement("div");
    div.className = "record-item";
    const cls = item.type==="in"?"money-in":"money-out";
    const prefix = item.type==="in"? "+":"-";
    div.innerHTML = `<div>${item.note}</div><div class="${cls}">${prefix}${item.money}</div>`;
    wrap.appendChild(div);
  })
}

function addRecord(){
  const type = document.getElementById("typeSel").value;
  const money = document.getElementById("moneyInput").value;
  const note = document.getElementById("noteInput").value.trim();
  if(!money){
    alert("请填写金额");
    return;
  }
  recordList.push({type,money,note});
  localStorage.setItem("squirrelBill",JSON.stringify(recordList));
  render();
  document.getElementById("moneyInput").value="";
  document.getElementById("noteInput").value="";
}

render();
</script>

<!-- ========== ServiceWorker 注册 & 新版本检测弹窗 ========== -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const registration = await navigator.serviceWorker.register('./sw.js');
      console.log("SW注册成功", registration);

      registration.addEventListener('updatefound', () => {
        const newWorker = registration.installing;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            if (confirm("✅松鼠记账发现新版本！点击确定立即更新APP")) {
              newWorker.postMessage({ action: 'skipWaiting' });
            }
          }
        })
      })

      navigator.serviceWorker.addEventListener('controllerchange', () => {
        window.location.reload();
      })

      // 每3小时后台自动检测一次更新
      setInterval(()=>{
        registration.update();
      }, 3 * 60 * 60 * 1000);

    } catch (err) {
      console.log("SW注册失败：", err);
    }
  })
}
</script>
</body>
</html>
