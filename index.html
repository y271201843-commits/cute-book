<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffb6c1">
<title>迷你萌宠记账本</title>
<style>
:root{--bg:#fff5f8;--card:#fff;--text:#5a3d4a;--sub:#b3929f;--line:#ffe4e9;--primary:#ff8fab;--primary-soft:#fff0f5;--green:#34d399;--red:#f87171;--orange:#fbbf24;--radius:26px;--radius-sm:18px;--shadow:0 10px 30px rgba(255,143,171,.15);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;padding-bottom:calc(80px + env(safe-area-inset-bottom));transition:background .3s;}
button{border:none;background:none;font-family:inherit;color:inherit;cursor:pointer;outline:none;}
input{font-family:inherit;outline:none;border:none;background:transparent;color:inherit;}
.icon-cute{font-size:32px;line-height:1;display:flex;align-items:center;justify-content:center;transition:transform .2s;}
@keyframes floatCute{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-6px) rotate(4deg);}}
@keyframes bounceCute{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.anim-float{animation:floatCute 2.5s ease-in-out infinite;}
.anim-bounce{animation:bounceCute 1.8s ease-in-out infinite;}
.hd{position:sticky;top:0;z-index:40;background:var(--bg);padding:16px 20px 10px;display:flex;justify-content:space-between;align-items:center;}
.hd h1{font-size:22px;font-weight:800;display:flex;align-items:center;gap:8px;}
.theme-btn{width:40px;height:40px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);color:var(--sub);font-size:20px;}
.main{padding:0 20px;}
.page{display:none;}
.page.active{display:block;}
.balance-card{background:linear-gradient(135deg,#ff8fab,#ffb6c1);color:#fff;border-radius:var(--radius);padding:24px;margin-bottom:20px;box-shadow:0 10px 30px rgba(255,143,171,.15);position:relative;overflow:hidden;}
.balance-label{font-size:14px;opacity:.9;font-weight:600;margin-bottom:6px;}
.balance-amount{font-size:38px;font-weight:800;margin-bottom:16px;}
.balance-footer{display:flex;gap:20px;font-size:13px;font-weight:600;background:rgba(255,255,255,.2);border-radius:12px;padding:8px 12px;}
.section-title{font-size:15px;font-weight:700;margin:20px 0 12px;display:flex;justify-content:space-between;align-items:center;}
.section-title button{font-size:12px;color:var(--primary);font-weight:700;background:var(--primary-soft);padding:6px 12px;border-radius:20px;}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.cat-item{background:var(--card);border-radius:var(--radius-sm);padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--shadow);border:2px solid transparent;cursor:pointer;}
.cat-item.active{border-color:var(--primary);background:var(--primary-soft);}
.cat-item.active .icon-cute{animation:wiggleCute 0.6s ease-in-out infinite;}
.cat-name{font-size:11px;color:var(--sub);font-weight:700;}
.rec-card{background:var(--card);border-radius:var(--radius-sm);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;}
.rec-icon{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;}
.rec-info{flex:1;min-width:0;}
.rec-info .name{font-size:15px;font-weight:700;}
.rec-info .note{font-size:12px;color:var(--sub);margin-top:2px;}
.rec-amt{font-size:17px;font-weight:800;white-space:nowrap;}
.rec-amt.exp{color:var(--red);}
.rec-amt.inc{color:var(--green);}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);}
.tabbar button{flex:1;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--sub);font-weight:700;transition:.2s;}
.tabbar button .ico{display:flex;align-items:center;justify-content:center;opacity:.5;font-size:22px;}
.tabbar button.active{color:var(--primary);}
.tabbar button.active .ico{opacity:1;transform:scale(1.15);}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:101;background:var(--card);border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .35s cubic-bezier(.25,.8,.25,1);padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:80vh;overflow-y:auto;}
.sheet.show{transform:translateY(0);}
.sheet-handle{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 16px;}
.sheet-title{font-size:18px;font-weight:800;margin-bottom:16px;text-align:center;}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;}
.keypad button{padding:18px 0;background:var(--bg);border-radius:12px;font-size:24px;font-weight:800;}
.keypad .confirm{background:var(--primary);color:#fff;font-size:18px;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;opacity:0;pointer-events:none;transition:opacity .3s;}
.overlay.show{opacity:1;pointer-events:auto;}
.btn-primary{width:100%;padding:14px;border-radius:14px;background:var(--primary);color:#fff;font-size:16px;font-weight:800;margin-top:12px;}
</style>
</head>
<body>
<header class="hd">
  <h1><span class="icon-cute anim-bounce" id="headerIcon">🐱</span><span id="pageTitle">记一笔</span></h1>
  <button class="theme-btn" onclick="alert('皮肤切换功能已加载')">🎨</button>
</header>
<main class="main">
  <section class="page active" id="page-add">
    <div class="balance-card" onclick="openAmountSheet()">
      <div class="balance-label">本次金额 (点击输入)</div>
      <div class="balance-amount" id="displayAmount">¥ 0.00</div>
      <div class="balance-footer"><span>📉 今日支出 <b id="todayExp">¥0.00</b></span><span>📈 今日收入 <b id="todayInc">¥0.00</b></span></div>
    </div>
    <input type="text" id="noteInput" placeholder="输入备注（也可以直接点下方快捷备注）" style="background:var(--card);padding:14px;border-radius:18px;width:100%;margin-bottom:16px;box-shadow:0 10px 30px rgba(255,143,171,.15);">
    <div class="section-title"><span>选择分类</span><button onclick="openAddCat()">➕ 自定义</button></div>
    <div class="cat-grid" id="catGrid"></div>
    <div class="section-title"><span>快捷备注</span><button onclick="openAddNote()">➕ 自定义</button></div>
    <div class="cat-grid" style="grid-template-columns:repeat(4,1fr);" id="quickNotes"></div>
  </section>
  <section class="page" id="page-list"><div class="balance-card" style="padding:20px;margin-bottom:16px;"><div class="balance-label">总资产结余</div><div class="balance-amount" style="font-size:30px;" id="totalBalance">¥0.00</div></div><div id="recordList"></div></section>
  <section class="page" id="page-stats"><div class="stats-card"><div class="stats-row"><div class="stats-item"><div class="label">本月收入</div><div class="val" id="stInc">¥0.00</div></div><div class="stats-item"><div class="label">本月支出</div><div class="val" id="stExp">¥0.00</div></div><div class="stats-item"><div class="label">本月结余</div><div class="val" id="stBal">¥0.00</div></div></div></div></section>
  <section class="page" id="page-goal"><div class="stats-card" style="text-align:center;padding:30px 20px;"><div class="icon-cute anim-float" style="font-size:60px;margin-bottom:10px;">🎯</div><div style="font-size:18px;font-weight:800;margin-bottom:8px;">我的储蓄目标</div><div style="color:#b3929f;font-size:13px;margin-bottom:16px;">为了心爱的小物件，加油攒钱吧！</div><div style="height:12px;background:#fff5f8;border-radius:6px;overflow:hidden;"><div id="goalBar" style="width:0%;height:100%;background:linear-gradient(90deg,#ff8fab,#ffb6c1);"></div></div><div style="display:flex;justify-content:space-between;margin-top:8px;font-size:13px;font-weight:700;"><span id="goalCur">¥0</span><span id="goalTotal">目标：¥0</span></div><input type="number" id="goalInput" placeholder="设定目标金额" style="background:var(--card);padding:14px;border-radius:12px;width:100%;margin-top:16px;text-align:center;"><button class="btn-primary" onclick="saveGoal()">保存目标</button></div></section>
  <section class="page" id="page-me"><div style="background:#fff;border-radius:24px;padding:20px;"><div class="setting-item"><div><div class="lbl">每日提醒</div><div class="desc">到点提醒你记账</div></div><div class="switch" style="width:50px;height:28px;border-radius:14px;background:#ffe4e9;position:relative;"><div style="width:24px;height:24px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;"></div></div></div></div></section>
</main>
<nav class="tabbar" id="tabbar">
  <button data-page="add" class="active" onclick="switchPage('add')"><span class="ico">✏️</span>记一笔</button>
  <button data-page="list" onclick="switchPage('list')"><span class="ico">📋</span>明细</button>
  <button data-page="stats" onclick="switchPage('stats')"><span class="ico">📊</span>统计</button>
  <button data-page="goal" onclick="switchPage('goal')"><span class="ico">🎯</span>攒钱</button>
  <button data-page="me" onclick="switchPage('me')"><span class="ico">👤</span>我的</button>
</nav>
<div class="overlay" id="amountOverlay" onclick="closeAmountSheet()"></div>
<div class="sheet" id="amountSheet"><div class="sheet-handle"></div><div class="sheet-title">输入金额</div><button class="sheet-close" onclick="closeAmountSheet()">✕</button><div style="text-align:center;font-size:44px;font-weight:800;color:#ff8fab;margin:16px 0 8px;" id="sheetAmount">¥ 0.00</div><div class="keypad"><button onclick="pressKey('1')">1</button><button onclick="pressKey('2')">2</button><button onclick="pressKey('3')">3</button><button onclick="pressKey('4')">4</button><button onclick="pressKey('5')">5</button><button onclick="pressKey('6')">6</button><button onclick="pressKey('7')">7</button><button onclick="pressKey('8')">8</button><button onclick="pressKey('9')">9</button><button onclick="pressKey('.')">.</button><button onclick="pressKey('0')">0</button><button onclick="pressKey('del')">⌫</button><button class="confirm" style="grid-column:span 3;" onclick="confirmAmount()">确定并自动保存</button></div></div>
<div class="overlay" id="catOverlay" onclick="closeAddCat()"></div>
<div class="sheet" id="catSheet"><div class="sheet-handle"></div><div class="sheet-title">添加自定义分类</div><button class="sheet-close" onclick="closeAddCat()">✕</button><input type="text" id="newCatName" placeholder="分类名称" style="background:#fff5f8;padding:14px;border-radius:12px;width:100%;margin-bottom:12px;"><div style="font-size:13px;color:#b3929f;margin-bottom:8px;">👇 选择一个图标：</div><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-height:160px;overflow-y:auto;" id="emojiPicker"></div><button class="btn-primary" onclick="saveNewCat()">保存分类</button></div>
<div class="overlay" id="noteOverlay" onclick="closeAddNote()"></div>
<div class="sheet" id="noteSheet"><div class="sheet-handle"></div><div class="sheet-title">添加快捷备注</div><button class="sheet-close" onclick="closeAddNote()">✕</button><input type="text" id="newNoteText" placeholder="备注标签" style="background:#fff5f8;padding:14px;border-radius:12px;width:100%;margin-bottom:12px;"><div style="font-size:13px;color:#b3929f;margin-bottom:8px;">👇 选择一个图标：</div><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-height:160px;overflow-y:auto;" id="noteEmojiPicker"></div><button class="btn-primary" onclick="saveNewNote()">保存标签</button></div>
<div id="toast" style="position:fixed;left:50%;bottom:110px;transform:translate(-50%,12px);background:#5a3d4a;color:#fff;padding:10px 22px;border-radius:20px;font-size:13px;font-weight:700;opacity:0;transition:.3s;z-index:999;white-space:nowrap;"></div>
<script>
const EMOJI_LIB = ['🍔','🍜','🍕','🍰','🍦','🍎','🍉','🥤','🧋','☕','🍺','🍣','🍞','🧁','🚗','🚌','🚲','✈️','🚇','🚕','🛍️','👗','👟','💄','💍','🎒','🧸','💻','🏠','💡','🧹','🛋️','🚿','🛏️','🎮','🎬','🎵','⚽','🎨','📚','📝','🎓','📖','🏥','💊','💉','🐱','🐶','🐼','🐰','🦁','🐘','🐵','🐯','🐻','🐭','🐸','💰','🧧','🎁','💎','⭐','🌟','✨','🔥','🌈','🌸','💖','❓'];
let records=[],customCats=[],quickNotes=[],theme='pink',formAmount='0';
function $(id){return document.getElementById(id);}
function fmt(n){return '¥'+Number(n||0).toFixed(2);}
function toast(msg){const t=$('toast');t.textContent=msg;t.style.opacity='1';t.style.transform='translate(-50%,0)';setTimeout(()=>{t.style.opacity='0';t.style.transform='translate(-50%,12px)';},2000);}
function switchPage(name){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='page-'+name));document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('active',b.dataset.page===name));const titles={add:'记一笔',list:'明细',stats:'统计',goal:'攒钱目标',me:'我的'};const icons={add:'🐱',list:'📋',stats:'📊',goal:'🎯',me:'👤'};$('headerIcon').textContent=icons[name];$('pageTitle').textContent=titles[name];if(name==='list')renderList();if(name==='stats')renderStats();if(name==='goal')renderGoal();window.scrollTo(0,0);}
function openAmountSheet(){$('amountOverlay').classList.add('show');$('amountSheet').classList.add('show');formAmount='0';$('sheetAmount').textContent='¥ 0.00';}
function closeAmountSheet(){$('amountOverlay').classList.remove('show');$('amountSheet').classList.remove('show');}
function pressKey(k){if(k==='del')formAmount=formAmount.length>1?formAmount.slice(0,-1):'0';else if(k==='.'){if(!formAmount.includes('.'))formAmount+='.';}else{formAmount=formAmount==='0'?k:formAmount+k;}$('sheetAmount').textContent='¥ '+formAmount;}
function confirmAmount(){const v=parseFloat(formAmount)||0;if(v<=0){toast('请输入金额');return;}$('displayAmount').textContent=fmt(v);closeAmountSheet();setTimeout(()=>saveRecord(v),200);}
function saveRecord(v){
  if(v<=0)return;
  records.push({id:Date.now(),date:new Date().toLocaleDateString('zh-CN'),type:'expense',amount:v,category:'餐饮',note:$('noteInput').value.trim(),createdAt:Date.now()});
  toast('已记一笔 '+fmt(v));
  $('noteInput').value='';
  renderList();renderStats();
  $('displayAmount').textContent='¥ 0.00';
}
function renderList(){
  if(!records.length){$('recordList').innerHTML='<div style="text-align:center;padding:40px;color:#b3929f;">还没有记录哦 🐣</div>';return;}
  let html='';records.slice().reverse().forEach(r=>{html+='<div class="rec-card"><div class="rec-icon" style="background:#fff0f5;">🍔</div><div class="rec-info"><div class="name">'+r.category+'</div>'+(r.note?'<div class="note">📝 '+r.note+'</div>':'')+'</div><div class="rec-amt exp">-'+fmt(r.amount)+'</div></div>';});
  $('recordList').innerHTML=html;
}
function renderStats(){
  const exp=records.filter(r=>r.type==='expense').reduce((s,r)=>s+Number(r.amount),0);
  $('stExp').textContent=fmt(exp);$('stInc').textContent='¥0.00';$('stBal').textContent=fmt(-exp);
}
function renderGoal(){const goal=parseFloat(localStorage.getItem('goal'))||0;$('goalInput').value=goal||'';$('goalTotal').textContent='目标：'+fmt(goal);$('goalCur').textContent='¥0';$('goalBar').style.width='0%';}
function saveGoal(){const g=parseFloat($('goalInput').value)||0;localStorage.setItem('goal',g);renderGoal();toast('目标已保存');}
function openAddCat(){$('catOverlay').classList.add('show');$('catSheet').classList.add('show');$('emojiPicker').innerHTML=EMOJI_LIB.map(e=>'<div style="font-size:24px;text-align:center;padding:6px;border-radius:10px;cursor:pointer;" onclick="selectEmoji(\''+e+'\',this)">'+e+'</div>').join('');}
function closeAddCat(){$('catOverlay').classList.remove('show');$('catSheet').classList.remove('show');}
function selectEmoji(e,el){window.selectedEmoji=e;document.querySelectorAll('#emojiPicker div').forEach(c=>c.style.background='transparent');el.style.background='#fff0f5';}
function saveNewCat(){const n=$('newCatName').value.trim();if(!n){toast('请输入名称');return;}customCats.push({name:n,icon:window.selectedEmoji||'🍔'});renderCatGrid();closeAddCat();$('newCatName').value='';toast('分类已添加');}
function renderCatGrid(){
  const cats=[{name:'餐饮',icon:'🍔'},{name:'饮品',icon:'🧋'},{name:'交通',icon:'🚗'},{name:'购物',icon:'🛍️'},{name:'居住',icon:'🏠'},{name:'娱乐',icon:'🎮'},{name:'学习',icon:'📚'},{name:'医疗',icon:'💊'},{name:'人情',icon:'🧧'},{name:'宠物',icon:'🐱'},{name:'护肤',icon:'🧴'},{name:'其他',icon:'🌟'},...customCats];
  $('catGrid').innerHTML=cats.map(c=>'<div class="cat-item" onclick="selectCat(this)"><span class="icon-cute">'+c.icon+'</span><span class="cat-name">'+c.name+'</span></div>').join('');
}
function selectCat(el){document.querySelectorAll('#catGrid .cat-item').forEach(c=>c.classList.remove('active'));el.classList.add('active');}
function openAddNote(){$('noteOverlay').classList.add('show');$('noteSheet').classList.add('show');$('noteEmojiPicker').innerHTML=EMOJI_LIB.map(e=>'<div style="font-size:24px;text-align:center;padding:6px;border-radius:10px;cursor:pointer;" onclick="selectNoteEmoji(\''+e+'\',this)">'+e+'</div>').join('');}
function closeAddNote(){$('noteOverlay').classList.remove('show');$('noteSheet').classList.remove('show');}
function selectNoteEmoji(e,el){window.selectedNoteEmoji=e;document.querySelectorAll('#noteEmojiPicker div').forEach(c=>c.style.background='transparent');el.style.background='#fff0f5';}
function saveNewNote(){const t=$('newNoteText').value.trim();if(!t){toast('请输入备注');return;}quickNotes.push({text:t,icon:window.selectedNoteEmoji||'📝'});renderQuickNotes();closeAddNote();$('newNoteText').value='';toast('备注已添加');}
function renderQuickNotes(){
  const defaultNotes=[{text:'早餐',icon:'🍳'},{text:'午餐',icon:'🍱'},{text:'晚餐',icon:'🍜'},{text:'打车',icon:'🚕'},{text:'网购',icon:'📦'},{text:'奶茶',icon:'🧋'},{text:'咖啡',icon:'☕'},{text:'看病',icon:'🏥'},{text:'买书',icon:'📖'},{text:'看电影',icon:'🎬'},{text:'送礼',icon:'🎁'},{text:'工资',icon:'💰'}];
  const allNotes=[...defaultNotes,...quickNotes];
  $('quickNotes').innerHTML=allNotes.map(n=>'<div class="cat-item" onclick="selectQuickNote(\''+n.text+'\')"><span class="icon-cute" style="font-size:22px;">'+n.icon+'</span><span class="cat-name" style="font-size:10px;">'+n.text+'</span></div>').join('');
}
function selectQuickNote(t){$('noteInput').value=t;toast('已选备注：'+t);}
renderCatGrid();renderQuickNotes();renderList();renderStats();renderGoal();
</script>
</body>
</html>
