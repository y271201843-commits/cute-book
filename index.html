<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffb6c1">
<title>迷你萌宠记账本</title>
<style>
:root{--bg:#fff5f8;--card:#fff;--text:#5a3d4a;--sub:#b3929f;--line:#ffe4e9;--primary:#ff8fab;--primary-soft:#fff0f5;--green:#34d399;--red:#f87171;--orange:#fbbf24;--radius:26px;--radius-sm:18px;--shadow:0 10px 30px rgba(255,143,171,.15);--shadow-heavy:0 14px 40px rgba(255,143,171,.25);}
[data-theme="blue"]{--bg:#f0f7ff;--card:#fff;--text:#1e293b;--sub:#94a3b8;--line:#e2e8f0;--primary:#60a5fa;--primary-soft:#eff6ff;--green:#10b981;--red:#ef4444;--orange:#f59e0b;}
[data-theme="purple"]{--bg:#f5f3ff;--card:#fff;--text:#3b0764;--sub:#c4b5fd;--line:#ede9fe;--primary:#a78bfa;--primary-soft:#f5f3ff;--green:#10b981;--red:#f43f5e;--orange:#f59e0b;}
[data-theme="dark"]{--bg:#0f0f13;--card:#1c1c1e;--text:#f2f2f7;--sub:#8e8e93;--line:#2c2c2e;--primary:#ff8fab;--primary-soft:#2c2c2e;--green:#30d158;--red:#ff453a;--orange:#ff9f0a;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;padding-bottom:calc(80px + env(safe-area-inset-bottom));transition:background .3s,color .3s;overflow-x:hidden;}
button{border:none;background:none;font-family:inherit;color:inherit;cursor:pointer;outline:none;}
input{font-family:inherit;outline:none;border:none;background:transparent;color:inherit;}
.icon-cute{width:36px;height:36px;display:flex;align-items:center;justify-content:center;transition:transform .2s;}
.icon-cute svg{width:100%;height:100%;fill:currentColor;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
/* 让图标动起来 */
@keyframes floatCute{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-6px) rotate(4deg);}}
@keyframes wiggleCute{0%,100%{transform:rotate(0deg);}25%{transform:rotate(-10deg);}75%{transform:rotate(10deg);}}
@keyframes bounceCute{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.anim-float{animation:floatCute 2.5s ease-in-out infinite;}
.anim-wiggle{animation:wiggleCute 0.6s ease-in-out infinite;}
.anim-bounce{animation:bounceCute 1.8s ease-in-out infinite;}

.hd{position:sticky;top:0;z-index:40;background:var(--bg);padding:16px 20px 10px;display:flex;justify-content:space-between;align-items:center;}
.hd h1{font-size:22px;font-weight:800;letter-spacing:-.5px;display:flex;align-items:center;gap:8px;}
.theme-btn{width:40px;height:40px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);color:var(--sub);font-size:20px;}
.theme-btn:active{transform:scale(.9) rotate(15deg);}
.main{padding:0 20px;}
.page{display:none;animation:slideUp .3s cubic-bezier(.25,.8,.25,1);}
.page.active{display:block;}
@keyframes slideUp{from{opacity:0;transform:translateY(15px);}to{opacity:1;transform:translateY(0);}}
.balance-card{background:linear-gradient(135deg,var(--primary),#ffb6c1);color:#fff;border-radius:var(--radius);padding:24px;margin-bottom:20px;box-shadow:var(--shadow-heavy);position:relative;overflow:hidden;}
[data-theme="blue"] .balance-card{background:linear-gradient(135deg,#60a5fa,#a5b4fc);}
[data-theme="purple"] .balance-card{background:linear-gradient(135deg,#a78bfa,#f0abfc);}
[data-theme="dark"] .balance-card{background:linear-gradient(135deg,#2c2c2e,#3a3a3c);}
.balance-card::after{content:"";position:absolute;right:-20px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.15);animation:floatCute 4s ease-in-out infinite;}
.balance-label{font-size:14px;opacity:.9;font-weight:600;margin-bottom:6px;}
.balance-amount{font-size:38px;font-weight:800;letter-spacing:-1px;margin-bottom:16px;}
.balance-footer{display:flex;gap:20px;font-size:13px;font-weight:600;background:rgba(255,255,255,.2);border-radius:12px;padding:8px 12px;backdrop-filter:blur(4px);}
.balance-footer span{opacity:1;display:flex;align-items:center;gap:4px;}
.section-title{font-size:15px;font-weight:700;margin:20px 0 12px;display:flex;justify-content:space-between;align-items:center;color:var(--text);}
.section-title button{font-size:12px;color:var(--primary);font-weight:700;background:var(--primary-soft);padding:6px 12px;border-radius:20px;display:flex;align-items:center;gap:4px;}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.cat-item{background:var(--card);border-radius:var(--radius-sm);padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s;border:2px solid transparent;cursor:pointer;}
.cat-item:active{transform:scale(.92);}
.cat-item.active{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 4px 15px rgba(255,143,171,.2);}
.cat-item.active .icon-cute{animation:wiggleCute 0.6s ease-in-out infinite;}
.cat-name{font-size:11px;color:var(--sub);font-weight:700;}
.rec-card{background:var(--card);border-radius:var(--radius-sm);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;transition:transform .2s;}
.rec-card:active{transform:scale(.98);}
.rec-icon{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
.rec-info{flex:1;min-width:0;}
.rec-info .name{font-size:15px;font-weight:700;}
.rec-info .note{font-size:12px;color:var(--sub);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:4px;}
.rec-amt{font-size:17px;font-weight:800;white-space:nowrap;}
.rec-amt.exp{color:var(--red);}
.rec-amt.inc{color:var(--green);}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);}
[data-theme="dark"] .tabbar{background:rgba(28,28,30,.9);}
.tabbar button{flex:1;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--sub);font-weight:700;transition:.2s;}
.tabbar button .ico{display:flex;align-items:center;justify-content:center;opacity:.5;transition:.2s;font-size:22px;}
.tabbar button.active{color:var(--primary);}
.tabbar button.active .ico{opacity:1;transform:scale(1.15) translateY(-2px);}
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;opacity:0;pointer-events:none;transition:opacity .3s;}
.sheet-overlay.show{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:101;background:var(--card);border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .35s cubic-bezier(.25,.8,.25,1);padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto;}
.sheet.show{transform:translateY(0);}
.sheet-handle{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 16px;}
.sheet-title{font-size:18px;font-weight:800;margin-bottom:16px;text-align:center;}
.sheet-close{position:absolute;top:20px;right:20px;color:var(--sub);width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:50%;font-size:16px;}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;}
.keypad button{padding:18px 0;background:var(--bg);border-radius:12px;font-size:24px;font-weight:800;transition:background .1s,transform .1s;color:var(--text);}
.keypad button:active{background:var(--primary-soft);transform:scale(.95);}
.keypad .special{font-size:18px;font-weight:600;color:var(--sub);display:flex;align-items:center;justify-content:center;}
.keypad .confirm{background:var(--primary);color:#fff;font-size:18px;font-weight:800;}
.stats-card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow);}
.stats-row{display:flex;justify-content:space-between;margin-bottom:16px;}
.stats-item{text-align:center;flex:1;}
.stats-item .label{font-size:12px;color:var(--sub);font-weight:700;margin-bottom:6px;}
.stats-item .val{font-size:18px;font-weight:800;}
.bar-item{margin-bottom:14px;}
.bar-head{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px;}
.bar-track{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;transition:width .6s;}
.setting-item{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);}
.setting-item:last-child{border-bottom:none;}
.setting-item .lbl{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
.setting-item .desc{font-size:12px;color:var(--sub);margin-top:2px;}
.switch{width:50px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:.2s;cursor:pointer;flex-shrink:0;}
.switch.on{background:var(--primary);}
.switch::after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.2);}
.switch.on::after{left:24px;}
#toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,12px);background:var(--text);color:var(--bg);padding:10px 22px;border-radius:20px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;z-index:999;white-space:nowrap;box-shadow:0 8px 25px rgba(0,0,0,.15);}
#toast.show{opacity:1;transform:translate(-50%,0);}
.empty{text-align:center;padding:50px 0;color:var(--sub);font-size:14px;font-weight:700;}
.btn-primary{width:100%;padding:14px;border-radius:14px;background:var(--primary);color:#fff;font-size:16px;font-weight:800;margin-top:12px;box-shadow:var(--shadow);}
</style>
</head>
<body>

<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <!-- 这里放你的卡通小猫 SVG 代码 -->
  <symbol id="cat" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="#ffb6c1"/>
    <path d="M8 14s1.5 2 4 2 4-2 4-2" stroke="#fff" stroke-width="2" fill="none"/>
    <circle cx="9" cy="10" r="1.5" fill="#fff"/><circle cx="15" cy="10" r="1.5" fill="#fff"/>
    <path d="M12 16l-1.5 1h3l-1.5-1z" fill="#fff"/>
    <path d="M6 8l2-3 3 2" stroke="#fff" stroke-width="1.5" fill="none"/>
    <path d="M18 8l-2-3-3 2" stroke="#fff" stroke-width="1.5" fill="none"/>
  </symbol>
  <!-- 放小狗、兔子等图标 -->
</svg>

<header class="hd">
  <h1><span class="icon-cute anim-bounce" id="headerIcon"><svg><use href="#cat"></use></svg></span><span id="pageTitle">记一笔</span></h1>
  <button class="theme-btn" id="themeBtn">🎨</button>
</header>

<main class="main">
  <section class="page active" id="page-add">
    <div class="balance-card" onclick="openAmountSheet()">
      <div class="balance-label">本次金额 (点击输入)</div>
      <div class="balance-amount" id="displayAmount">¥ 0.00</div>
      <div class="balance-footer">
        <span>📉 今日支出 <b id="todayExp">¥0.00</b></span>
        <span>📈 今日收入 <b id="todayInc">¥0.00</b></span>
      </div>
    </div>
    <div style="margin-bottom:16px;background:var(--card);padding:14px;border-radius:var(--radius-sm);box-shadow:var(--shadow);">
      <input type="text" id="noteInput" placeholder="输入备注（也可以直接点下方快捷备注）" style="width:100%;font-size:15px;">
    </div>
    <div class="section-title"><span>选择分类</span><button onclick="openAddCat()">➕ 自定义</button></div>
    <div class="cat-grid" id="catGrid"></div>
    <div class="section-title"><span>快捷备注</span><button onclick="openAddNote()">➕ 自定义</button></div>
    <div class="cat-grid" style="grid-template-columns:repeat(4,1fr);" id="quickNotes"></div>
  </section>

  <section class="page" id="page-list">
    <div class="balance-card" style="padding:20px;margin-bottom:16px;">
      <div class="balance-label">总资产结余</div>
      <div class="balance-amount" style="font-size:30px;" id="totalBalance">¥0.00</div>
    </div>
    <div id="recordList"></div>
  </section>

  <section class="page" id="page-stats">
    <div class="stats-card">
      <div class="stats-row">
        <div class="stats-item"><div class="label">本月收入</div><div class="val" style="color:var(--green)" id="stInc">¥0.00</div></div>
        <div class="stats-item"><div class="label">本月支出</div><div class="val" style="color:var(--red)" id="stExp">¥0.00</div></div>
        <div class="stats-item"><div class="label">本月结余</div><div class="val" style="color:var(--primary)" id="stBal">¥0.00</div></div>
      </div>
    </div>
    <div class="stats-card">
      <div class="section-title" style="margin-top:0;">支出分类排行</div>
      <div class="bar-wrap" id="rankBox"></div>
    </div>
  </section>

  <section class="page" id="page-goal">
    <div class="stats-card" style="text-align:center;padding:30px 20px;">
      <div class="icon-cute anim-float" style="font-size:60px;margin-bottom:10px;">🎯</div>
      <div style="font-size:18px;font-weight:800;margin-bottom:8px;">我的储蓄目标</div>
      <div style="color:var(--sub);font-size:13px;margin-bottom:16px;">为了心爱的小物件，加油攒钱吧！</div>
      <div class="bar-track" style="height:12px;"><div class="bar-fill" id="goalBar" style="width:0%;background:linear-gradient(90deg,var(--primary),#ffb6c1);"></div></div>
      <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:13px;font-weight:700;">
        <span id="goalCur">¥0</span>
        <span id="goalTotal">目标：¥0</span>
      </div>
      <div class="setting-item" style="margin-top:16px;border:none;padding:0;">
        <div class="lbl">设定目标金额</div>
        <input type="number" id="goalInput" style="text-align:right;font-size:18px;font-weight:800;width:120px;color:var(--primary);" placeholder="0">
      </div>
      <button class="btn-primary" onclick="saveGoal()">保存目标</button>
    </div>
  </section>

  <section class="page" id="page-me">
    <div class="stats-card">
      <div class="setting-item">
        <div><div class="lbl">每日提醒</div><div class="desc">到点提醒你记账</div></div>
        <div class="switch" id="remindSwitch" onclick="toggleRemind()"></div>
      </div>
      <div class="setting-item">
        <div><div class="lbl">按键音效</div><div class="desc">点击键盘的咔哒声</div></div>
        <div class="switch" id="soundSwitch" onclick="toggleSound()"></div>
      </div>
      <div class="setting-item">
        <div><div class="lbl">超支预警</div><div class="desc">超出本月预算时提醒</div></div>
        <div class="switch" id="warnSwitch" onclick="toggleWarn()"></div>
      </div>
    </div>
    <div class="stats-card">
      <div class="section-title" style="margin-top:0;">数据管理</div>
      <button class="btn-primary" style="background:var(--primary-soft);color:var(--primary);box-shadow:none;" onclick="exportData()">📤 导出数据备份</button>
      <button class="btn-primary" style="background:var(--primary-soft);color:var(--primary);box-shadow:none;margin-top:8px;" onclick="importData()">📥 导入数据恢复</button>
      <button class="btn-primary" style="background:#fff1f0;color:var(--red);box-shadow:none;margin-top:8px;" onclick="clearAllData()">🗑️ 清空所有数据</button>
    </div>
  </section>
</main>

<nav class="tabbar" id="tabbar">
  <button data-page="add" class="active" onclick="switchPage('add')"><span class="ico">✏️</span>记一笔</button>
  <button data-page="list" onclick="switchPage('list')"><span class="ico">📋</span>明细</button>
  <button data-page="stats" onclick="switchPage('stats')"><span class="ico">📊</span>统计</button>
  <button data-page="goal" onclick="switchPage('goal')"><span class="ico">🎯</span>攒钱</button>
  <button data-page="me" onclick="switchPage('me')"><span class="ico">👤</span>我的</button>
</nav>

<!-- 弹窗组件，确保所有函数可见 -->

<script>
(function(){
'use strict';
// 简化的JS逻辑，确保不中断
const $=id=>document.getElementById(id);
function switchPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='page-'+name));
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('active',b.dataset.page===name));
  const titles={add:'记一笔',list:'明细',stats:'统计',goal:'攒钱目标',me:'我的'};
  const icons={add:'🐱',list:'📋',stats:'📊',goal:'🎯',me:'👤'};
  $('headerIcon').innerHTML = `<span class="icon-cute anim-bounce">${icons[name]}</span>`;
  $('pageTitle').textContent = titles[name];
  if(name==='list')renderList(); if(name==='stats')renderStats(); if(name==='goal')renderGoal();
}
function saveGoal(){
  const g = parseFloat($('goalInput').value) || 0;
  localStorage.setItem('goal', g);
  renderGoal();
  alert('目标已保存！');
}
function renderGoal(){
  const goal = parseFloat(localStorage.getItem('goal')) || 0;
  $('goalInput').value = goal || '';
  $('goalTotal').textContent = '目标：¥' + goal;
  $('goalCur').textContent = '¥0'; // 简化版，防止报错
}
// 暴露所有函数给HTML
window.switchPage = switchPage;
window.saveGoal = saveGoal;
window.openAmountSheet = function(){alert('点击了金额卡片');};
window.openAddCat = function(){alert('点击了自定义分类');};
window.openAddNote = function(){alert('点击了自定义备注');};

// 启动
switchPage('add');
})();
</script>
</body>
</html>
