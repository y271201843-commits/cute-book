<!DOCTYPE html><html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ff7eb3">
<title>灵动记账本</title>
<style>
:root{--bg:#f7f8fc;--card:#fff;--text:#1c1c1e;--sub:#8e8e93;--line:#f0f0f5;--primary:#5b6ef5;--primary-soft:#eef0ff;--green:#34c759;--red:#ff3b30;--orange:#ff9500;--radius:24px;--radius-sm:16px;--shadow:0 8px 30px rgba(0,0,0,.04);--shadow-heavy:0 12px 40px rgba(0,0,0,.1);}
[data-theme="pink"]{--bg:#fff5f8;--card:#fff;--text:#4a3b42;--sub:#a3929a;--line:#ffe4e9;--primary:#ff7eb3;--primary-soft:#fff0f5;--green:#00b894;--red:#ff7675;--orange:#fdcb6e;--shadow:0 8px 30px rgba(255,126,179,.1);}
[data-theme="blue"]{--bg:#f0f7ff;--card:#fff;--text:#1e293b;--sub:#94a3b8;--line:#e2e8f0;--primary:#3b82f6;--primary-soft:#eff6ff;--green:#10b981;--red:#ef4444;--orange:#f59e0b;}
[data-theme="purple"]{--bg:#f5f3ff;--card:#fff;--text:#2e1065;--sub:#a78bfa;--line:#ede9fe;--primary:#8b5cf6;--primary-soft:#f5f3ff;--green:#10b981;--red:#f43f5e;--orange:#f59e0b;}
[data-theme="mint"]{--bg:#f0fdf4;--card:#fff;--text:#064e3b;--sub:#6ee7b7;--line:#d1fae5;--primary:#10b981;--primary-soft:#ecfdf5;--green:#10b981;--red:#ef4444;--orange:#f59e0b;}
[data-theme="orange"]{--bg:#fff7ed;--card:#fff;--text:#7c2d12;--sub:#fdba74;--line:#ffedd5;--primary:#f97316;--primary-soft:#fff7ed;--green:#10b981;--red:#ef4444;--orange:#f59e0b;}
[data-theme="dark"]{--bg:#0f0f13;--card:#1c1c1e;--text:#f2f2f7;--sub:#8e8e93;--line:#2c2c2e;--primary:#636366;--primary-soft:#2c2c2e;--green:#30d158;--red:#ff453a;--orange:#ff9f0a;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;padding-bottom:calc(80px + env(safe-area-inset-bottom));transition:background .3s,color .3s;overflow-x:hidden;}
button{border:none;background:none;font-family:inherit;color:inherit;cursor:pointer;outline:none;}
input{font-family:inherit;outline:none;border:none;background:transparent;color:inherit;}
.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.icon-lg{width:28px;height:28px;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.anim-bounce{animation:bounce 1.5s ease-in-out infinite;}
.anim-pulse{animation:pulse 2s ease-in-out infinite;}
.anim-float{animation:float 2s ease-in-out infinite;}
.hd{position:sticky;top:0;z-index:40;background:var(--bg);padding:16px 20px 10px;display:flex;justify-content:space-between;align-items:center;transition:background .3s;}
.hd h1{font-size:22px;font-weight:800;letter-spacing:-.5px;display:flex;align-items:center;gap:8px;}
.theme-btn{width:36px;height:36px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);transition:transform .2s;color:var(--sub);}
.theme-btn:active{transform:scale(.9) rotate(15deg);}
.main{padding:0 20px;}
.page{display:none;animation:fadeIn .3s cubic-bezier(.25,.8,.25,1);}
.page.active{display:block;}
.balance-card{background:linear-gradient(135deg,var(--primary),#7c8cf8);color:#fff;border-radius:var(--radius);padding:24px;margin-bottom:20px;box-shadow:var(--shadow-heavy);position:relative;overflow:hidden;}
[data-theme="pink"] .balance-card{background:linear-gradient(135deg,#ffb6c1,#ff7eb3);}
[data-theme="dark"] .balance-card{background:linear-gradient(135deg,#2c2c2e,#3a3a3c);}
.balance-card::after{content:"";position:absolute;right:-20px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.1);animation:float 3s ease-in-out infinite;}
.balance-label{font-size:14px;opacity:.85;font-weight:500;margin-bottom:6px;}
.balance-amount{font-size:36px;font-weight:800;letter-spacing:-1px;margin-bottom:16px;animation:float 2s ease-in-out infinite;}
.balance-footer{display:flex;gap:20px;font-size:13px;font-weight:600;}
.balance-footer span{opacity:.9;display:flex;align-items:center;gap:4px;}
.section-title{font-size:15px;font-weight:700;margin:20px 0 12px;display:flex;justify-content:space-between;align-items:center;}
.section-title button{font-size:12px;color:var(--primary);font-weight:600;background:var(--primary-soft);padding:4px 10px;border-radius:20px;display:flex;align-items:center;gap:4px;}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.cat-item{background:var(--card);border-radius:var(--radius-sm);padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s;border:1.5px solid transparent;cursor:pointer;}
.cat-item:active{transform:scale(.92);}
.cat-item.active{border-color:var(--primary);background:var(--primary-soft);}
.cat-icon{display:flex;align-items:center;justify-content:center;height:28px;}
.cat-name{font-size:11px;color:var(--sub);font-weight:600;}
.rec-card{background:var(--card);border-radius:var(--radius-sm);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;transition:transform .2s;}
.rec-card:active{transform:scale(.98);}
.rec-icon{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.rec-info{flex:1;min-width:0;}
.rec-info .name{font-size:15px;font-weight:700;}
.rec-info .note{font-size:12px;color:var(--sub);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rec-amt{font-size:17px;font-weight:800;white-space:nowrap;}
.rec-amt.exp{color:var(--red);}
.rec-amt.inc{color:var(--green);}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;background:rgba(255,255,255,.85);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);}
[data-theme="dark"] .tabbar{background:rgba(28,28,30,.85);}
.tabbar button{flex:1;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--sub);font-weight:600;transition:.2s;}
.tabbar button .ico{display:flex;align-items:center;justify-content:center;opacity:.5;transition:.2s;}
.tabbar button.active{color:var(--primary);}
.tabbar button.active .ico{opacity:1;transform:scale(1.15);}
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;opacity:0;pointer-events:none;transition:opacity .3s;}
.sheet-overlay.show{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:101;background:var(--card);border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .35s cubic-bezier(.25,.8,.25,1);padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto;}
.sheet.show{transform:translateY(0);}
.sheet-handle{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 16px;}
.sheet-title{font-size:18px;font-weight:800;margin-bottom:16px;text-align:center;}
.sheet-close{position:absolute;top:20px;right:20px;color:var(--sub);width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:50%;}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;}
.keypad button{padding:18px 0;background:var(--bg);border-radius:12px;font-size:22px;font-weight:700;transition:background .1s;color:var(--text);}
.keypad button:active{background:var(--primary-soft);transform:scale(.95);}
.keypad .special{font-size:16px;font-weight:600;color:var(--sub);display:flex;align-items:center;justify-content:center;}
.keypad .confirm{background:var(--primary);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;}
.stats-card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow);}
.stats-row{display:flex;justify-content:space-between;margin-bottom:16px;}
.stats-item{text-align:center;flex:1;}
.stats-item .label{font-size:12px;color:var(--sub);font-weight:600;margin-bottom:6px;}
.stats-item .val{font-size:18px;font-weight:800;}
.bar-item{margin-bottom:14px;}
.bar-head{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px;}
.bar-track{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;transition:width .6s;}
.setting-item{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);}
.setting-item:last-child{border-bottom:none;}
.setting-item .lbl{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
.setting-item .desc{font-size:12px;color:var(--sub);margin-top:2px;}
.switch{width:50px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:.2s;cursor:pointer;flex-shrink:0;}
.switch.on{background:var(--primary);}
.switch::after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.2);}
.switch.on::after{left:24px;}
#toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,12px);background:var(--text);color:var(--bg);padding:10px 22px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:999;}
#toast.show{opacity:1;transform:translate(-50%,0);}
.empty{text-align:center;padding:50px 0;color:var(--sub);font-size:14px;font-weight:600;}
.fab{position:fixed;right:20px;bottom:100px;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#7c8cf8);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 25px rgba(91,110,245,.4);z-index:50;transition:transform .2s;}
[data-theme="pink"] .fab{background:linear-gradient(135deg,#ffb6c1,#ff7eb3);}
.fab:active{transform:scale(.9) rotate(90deg);}
.btn-primary{width:100%;height:52px;border-radius:16px;font-size:16px;font-weight:800;background:var(--primary);color:#fff;box-shadow:0 6px 20px rgba(91,110,245,.3);display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;transition:transform .1s;}
.btn-primary:active{transform:scale(.97);}
</style>
</head>

(function(){
'use strict';
const EXPENSE_CATS=[

];
const DEFAULT_INCOME=[{name:'工资',icon:'i-money',color:'#00B894'},{name:'奖金',icon:'i-gift',color:'#16A34A'},{name:'兼职',icon:'i-money',color:'#22C55E'},{name:'理财',icon:'i-chart',color:'#0891B2'},{name:'红包',icon:'i-gift',color:'#E11D48'},{name:'其他',icon:'i-star',color:'#A3929A'}];
const ICONS=['i-food','i-drink','i-bus','i-shop','i-home','i-game','i-book','i-med','i-pet','i-skin','i-gift','i-money','i-star','i-note','i-target'];
const QUICK_NOTES=['早餐','午餐','晚餐','打车','网购','奶茶','咖啡','看病','买书','看电影','送礼','工资'];
const THEMES=['pink','blue','purple','mint','orange','dark'];
const RK='cute_book_records_v6',SK='cute_book_settings_v6',CK='cute_book_cats_v6';
let records=[],settings={},customCats=[],reminders=[],theme='pink',formType='expense',formCat='餐饮',formAmount='0',currentSubCat='';
let alarmTimer=null,alarmAudioCtx=null,alarmOsc=null;

const $=id=>document.getElementById(id);
const pad2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const ym=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1);
function fmt(n){n=Number(n)||0;const neg=n<0;const s=Math.abs(n).toFixed(2);const p=s.split('.');return (neg?'-':'')+'¥'+p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',')+'.'+p[1];}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let toastTimer;
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2000);}

let audioCtx=null;
function playSound(type){
  if(!settings.soundOn)return;
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
    osc.connect(gain);gain.connect(audioCtx.destination);
    const now=audioCtx.currentTime;
    if(type==='key'){osc.type='sine';osc.frequency.setValueAtTime(600,now);osc.frequency.exponentialRampToValueAtTime(300,now+.05);gain.gain.setValueAtTime(.08,now);gain.gain.exponentialRampToValueAtTime(.001,now+.05);osc.start(now);osc.stop(now+.05);}
    else if(type==='save'){osc.type='triangle';osc.frequency.setValueAtTime(523.25,now);osc.frequency.setValueAtTime(659.25,now+.1);osc.frequency.setValueAtTime(783.99,now+.2);gain.gain.setValueAtTime(.12,now);gain.gain.exponentialRampToValueAtTime(.01,now+.4);osc.start(now);osc.stop(now+.4);}
    else if(type==='click'){osc.type='sine';osc.frequency.setValueAtTime(800,now);gain.gain.setValueAtTime(.05,now);gain.gain.exponentialRampToValueAtTime(.001,now+.03);osc.start(now);osc.stop(now+.03);}
  }catch(e){}
}
function playAlarmSound(){
  if(!settings.alarmOn)return;
  try{
    if(!alarmAudioCtx)alarmAudioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(alarmOsc)return;
    alarmOsc=alarmAudioCtx.createOscillator();
    const gain=alarmAudioCtx.createGain();
    alarmOsc.connect(gain);gain.connect(alarmAudioCtx.destination);
    alarmOsc.type='square';alarmOsc.frequency.value=880;
    const now=alarmAudioCtx.currentTime;
    gain.gain.setValueAtTime(.2,now);
    alarmOsc.start(now);
    setTimeout(()=>{if(alarmOsc){alarmOsc.stop();alarmOsc=null;}},1500);
  }catch(e){}
}

function loadData(){
  try{records=JSON.parse(localStorage.getItem(RK)||'[]');}catch(e){records=[];}
  try{const s=JSON.parse(localStorage.getItem(SK)||'{}');settings={monthlyBudget:0,remindOn:false,remindTime:'21:00',remindText:'别忘了记账哦～',lastRemindDate:'',soundOn:true,alarmOn:true,...s};}catch(e){settings={monthlyBudget:0,remindOn:false,remindTime:'21:00',remindText:'别忘了记账哦～',lastRemindDate:'',soundOn:true,alarmOn:true};}
  try{customCats=JSON.parse(localStorage.getItem(CK)||'[]');}catch(e){customCats=[];}
  try{reminders=JSON.parse(localStorage.getItem('cute_book_reminders_v6')||'[]');}catch(e){reminders=[];}
  theme=localStorage.getItem('cute_book_theme')||'pink';
}
function saveRecords(){localStorage.setItem(RK,JSON.stringify(records));}
function saveSettings(){localStorage.setItem(SK,JSON.stringify(settings));}
function saveCustomCats(){localStorage.setItem(CK,JSON.stringify(customCats));}
function saveReminders(){localStorage.setItem('cute_book_reminders_v6',JSON.stringify(reminders));}
function setTheme(t){theme=t;document.documentElement.setAttribute('data-theme',t);localStorage.setItem('cute_book_theme',t);toast('主题已切换');}

function getCats(type){return type==='expense'?[...EXPENSE_CATS,...customCats]:DEFAULT_INCOME;}
function getCatInfo(name){const all=[...EXPENSE_CATS,...DEFAULT_INCOME,...customCats];return all.find(c=>c.name===name)||{icon:'i-star',color:'#A3929A'};}
function monthRecords(m){return records.filter(r=>r.date.slice(0,7)===m);}
function sumBy(list,type){return list.filter(r=>r.type===type).reduce((s,r)=>s+Number(r.amount||0),0);}
function catSum(list,type,cat){return list.filter(r=>r.type===type&&r.category===cat).reduce((s,r)=>s+Number(r.amount||0),0);}

function switchPage(name){
  playSound('click');
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='page-'+name));
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('active',b.dataset.page===name));
  const titles={add:'记一笔',list:'明细',stats:'统计',remind:'提醒'};
  $('pageTitle').textContent=titles[name]||'灵动记账本';
  if(name==='list')renderList(); if(name==='stats')renderStats(); if(name==='remind')renderRemind();
  window.scrollTo(0,0);
}

function openAmountSheet(){playSound('click');$('amountOverlay').classList.add('show');$('amountSheet').classList.add('show');formAmount='0';updateSheetAmount();}
function closeAmountSheet(){$('amountOverlay').classList.remove('show');$('amountSheet').classList.remove('show');}
function updateSheetAmount(){$('sheetAmount').textContent='¥ '+formAmount;}
function pressKey(k){
  playSound('key');
  if(k==='del'){formAmount=formAmount.length>1?formAmount.slice(0,-1):'0';}
  else if(k==='.'){if(!formAmount.includes('.'))formAmount+='.';}
  else{if(formAmount==='0')formAmount=k;else formAmount+=k;}
  if(formAmount.length>10)formAmount=formAmount.slice(0,10);
  updateSheetAmount();
}
function confirmAmount(){
  const v=parseFloat(formAmount)||0;
  if(v<=0){toast('请输入正确金额');return;}
  $('displayAmount').textContent=fmt(v);
  closeAmountSheet();

function renderCatGrid(){
  const currentCatList=getCats(formType);
  $('catGrid').innerHTML=currentCatList.map(c=>`
    <div class="cat-item ${c.name===formCat?'active':''}" onclick="selectCat('${esc(c.name)}')">
      <span class="cat-icon"><svg class="icon" style="color:${c.color}"><use href="#${c.icon}"></use></svg></span>
      <span class="cat-name">${esc(c.name)}</span>
    </div>`).join('');
}
function selectCat(name){
  playSound('click');
  formCat=name;
  renderCatGrid();
  const cat=getCats(formType).find(c=>c.name===name);
  if(cat&&cat.subs&&cat.subs.length>0){
    currentSubCat='';
    $('subCatTitle').textContent=name+' - 详细分类';
    $('subCatGrid').innerHTML=cat.subs.map(s=>`
      <div class="cat-item ${s===currentSubCat?'active':''}" onclick="selectSubCat('${esc(s)}')">
        <span class="cat-icon"><svg class="icon" style="color:${cat.color}"><use href="#${cat.icon}"></use></svg></span>
        <span class="cat-name">${esc(s)}</span>
      </div>`).join('');
    $('subCatOverlay').classList.add('show');$('subCatSheet').classList.add('show');
  }
}
function selectSubCat(subName){playSound('click');currentSubCat=subName;$('subCatTitle').textContent=formCat+' - '+subName;setTimeout(()=>{closeSubCat();toast('已选：'+formCat+' - '+subName);},200);}
function closeSubCat(){$('subCatOverlay').classList.remove('show');$('subCatSheet').classList.remove('show');}

function openAddCat(){playSound('click');$('catOverlay').classList.add('show');$('catSheet').classList.add('show');}
function closeAddCat(){$('catOverlay').classList.remove('show');$('catSheet').classList.remove('show');}
function saveNewCat(){
  const n=$('newCatName').value.trim();
  if(!n){toast('请输入分类名称');return;}
  const active=document.querySelector('#iconPicker .emoji-active');
  const icon=active?active.dataset.icon:'i-star';
  customCats.push({name:n,icon,color:'#5b6ef5',subs:['其他']});
  saveCustomCats();renderCatGrid();closeAddCat();$('newCatName').value='';toast('分类已添加');
}
function renderIconPicker(){
  $('iconPicker').innerHTML=ICONS.map(i=>`<button data-icon="${i}" style="padding:10px 0;background:var(--bg);border-radius:12px;display:flex;align-items:center;justify-content:center;" onclick="pickIcon(this)"><svg class="icon icon-lg" style="color:var(--sub)"><use href="#${i}"></use></svg></button>`).join('');

function pickIcon(el){document.querySelectorAll('#iconPicker button').forEach(b=>{b.style.background='var(--bg)';b.querySelector('svg').style.color='var(--sub)';});el.style.background='var(--primary-soft)';el.querySelector('svg').style.color='var(--primary)';el.classList.add('emoji-active');}

function selectQuickNote(note){
  playSound('click');
  const inp=$('noteInput');
  if(inp.value===note){inp.value='';toast('已取消备注');}else{inp.value=note;toast('已选备注：'+note);}

function renderQuickNotes(){
  const noteVal=$('noteInput')?$('noteInput').value:'';

    <div class="cat-item ${n===noteVal?'active':''}" onclick="selectQuickNote('${esc(n)}')" style="padding:10px 4px;">

    </div>`).join('');

function saveRecord(){
  const v=parseFloat(formAmount)||0;
  if(v<=0){toast('请先输入金额');return;}
  const date=ymd(new Date());
  const note=$('noteInput').value.trim();
  const displayCat=currentSubCat?formCat+'/'+currentSubCat:formCat;
  records.push({id:genId(),date,type:formType,category:displayCat,amount:Math.round(v*100)/100,note,createdAt:Date.now()});
  saveRecords();playSound('save');toast('已记一笔 '+fmt(v));
  formAmount='0';$('displayAmount').textContent='¥ 0.00';$('noteInput').value='';currentSubCat='';
  renderQuickNotes();renderList();renderStats();renderBalance();
}

function renderBalance(){
  const m=ym(new Date());const list=monthRecords(m);
  $('totalBalance').textContent=fmt(sumBy(list,'income')-sumBy(list,'expense'));
  const today=ymd(new Date());const tl=records.filter(r=>r.date===today);
  $('todayExp').textContent=fmt(sumBy(tl,'expense'));$('todayInc').textContent=fmt(sumBy(tl,'income'));
}

function renderList(){
  const list=records.slice().sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt));
  if(!list.length){$('recordList').innerHTML='<div class="empty"><svg class="icon" style="width:50px;height:50px;margin-bottom:12px;opacity:.3"><use href="#i-star"></use></svg>还没有记录</div>';return;}
  const groups={};list.forEach(r=>{(groups[r.date]=groups[r.date]||[]).push(r);});
  let html='';
  Object.keys(groups).sort((a,b)=>b.localeCompare(a)).forEach(date=>{
    const items=groups[date];
    html+=`<div style="font-size:12px;color:var(--sub);font-weight:700;margin:16px 0 8px;padding-left:4px;">${date}</div>`;
    items.forEach(r=>{
      const catName = r.category.split('/')[0];
      const info=getCatInfo(catName);const sign=r.type==='expense'?'-':'+';
      html+=`<div class="rec-card"><div class="rec-icon" style="background:${info.color}20;color:${info.color}"><svg class="icon"><use href="#${info.icon}"></use></svg></div><div class="rec-info"><div class="name">${esc(r.category)}</div>${r.note?`<div class="note">${esc(r.note)}</div>`:''}</div><div class="rec-amt ${r.type==='expense'?'exp':'inc'}">${sign}${fmt(r.amount)}</div><button onclick="delRecord('${r.id}')" style="color:var(--sub);padding:8px;"><svg class="icon"><use href="#i-cancel"></use></svg></button></div>`;
    });
  });
  $('recordList').innerHTML=html;
}
function delRecord(id){if(!confirm('确定删除？'))return;records=records.filter(r=>r.id!==id);saveRecords();renderList();renderStats();renderBalance();}

function renderStats(){
  const m=ym(new Date());const list=monthRecords(m);
  const inc=sumBy(list,'income'),exp=sumBy(list,'expense'),bal=inc-exp;
  $('stInc').textContent=fmt(inc);$('stExp').textContent=fmt(exp);$('stBal').textContent=fmt(bal);
  const map={};list.filter(r=>r.type==='expense').forEach(r=>{
    const mainCat = r.category.split('/')[0];
    map[mainCat]=(map[mainCat]||0)+Number(r.amount);
  });
  const arr=Object.entries(map).sort((a,b)=>b[1]-a[1]);const total=arr.reduce((s,x)=>s+x[1],0);
  const box=$('rankBox');
  if(!arr.length){box.innerHTML='<div class="empty" style="padding:20px 0">本月还没有支出</div>';}
  else{box.innerHTML=arr.map(([cat,amt])=>{const pct=total>0?(amt/total*100):0;const info=getCatInfo(cat);
    return `<div class="bar-item"><div class="bar-head"><span style="display:flex;align-items:center;gap:6px;"><svg class="icon" style="width:18px;height:18px;color:${info.color}"><use href="#${info.icon}"></use></svg>${esc(cat)}<span style="font-size:11px;color:var(--sub);background:var(--bg);padding:2px 6px;border-radius:6px;">${pct.toFixed(1)}%</span></span><span style="color:var(--red)">${fmt(amt)}</span></div><div class="bar-track"><div class="bar-fill" style="width:${pct.toFixed(1)}%;background:${info.color}"></div></div></div>`;}).join('');}
}

function renderRemind(){
  $('remindSwitch').classList.toggle('on',!!settings.remindOn);
  $('remindTime').value=settings.remindTime||'21:00';
  $('remindText').value=settings.remindText||'';
  $('soundSwitch').classList.toggle('on',!!settings.soundOn);
  $('alarmSwitch').classList.toggle('on',!!settings.alarmOn);

  if(!reminders.length){list.innerHTML='<div class="empty" style="padding:20px 0">暂无学习/任务提醒</div>';return;}
  list.innerHTML=reminders.map(r=>`
    <div class="setting-item">
      <div><div class="lbl">${esc(r.text)}</div><div class="desc">${r.time} ${r.done?'✅ 已完成':'⏳ 待办'}</div></div>
      <div style="display:flex;gap:8px;">
        <button onclick="toggleReminderDone('${r.id}')" style="color:var(--primary);padding:4px;"><svg class="icon" style="width:20px;height:20px"><use href="#i-target"></use></svg></button>
        <button onclick="delReminder('${r.id}')" style="color:var(--sub);padding:4px;"><svg class="icon" style="width:20px;height:20px"><use href="#i-cancel"></use></svg></button>
      </div>
    </div>`).join('');
}
function openAddReminder(){playSound('click');$('reminderOverlay').classList.add('show');$('reminderSheet').classList.add('show');$('newReminderTime').value='20:00';}

function saveNewReminder(){

  if(!t||!time){toast('请填写完整');return;}

  saveReminders();renderRemind();closeAddReminder();$('newReminderText').value='';toast('提醒已添加');
}
function toggleReminderDone(id){const r=reminders.find(x=>x.id===id);if(r){r.done=!r.done;saveReminders();renderRemind();}}
function delReminder(id){if(!confirm('删除此提醒？'))return;reminders=reminders.filter(r=>r.id!==id);saveReminders();renderRemind();}

function toggleRemind(){settings.remindOn=!settings.remindOn;if(settings.remindOn)settings.lastRemindDate='';saveSettings();renderRemind();toast(settings.remindOn?'每日记账提醒已开启':'已关闭');}
function toggleSound(){settings.soundOn=!settings.soundOn;saveSettings();renderRemind();toast(settings.soundOn?'按键音效已开启':'已关闭按键音效');}
function toggleAlarm(){settings.alarmOn=!settings.alarmOn;saveSettings();renderRemind();toast(settings.alarmOn?'闹钟声音已开启':'已关闭闹钟声音');}

function testRemind(){
  if(Notification.permission==='granted'){new Notification('📝 测试提醒',{body:'这是一个测试通知！'});playAlarmSound();}
  else{Notification.requestPermission().then(p=>{if(p==='granted'){new Notification('📝 测试提醒',{body:'这是一个测试通知！'});playAlarmSound();}else toast('未授权通知');});}
}

function checkReminders(){
  const now=new Date();const today=ymd(now);const cur=pad2(now.getHours())+':'+pad2(now.getMinutes());
  if(settings.remindOn&&cur>=settings.remindTime&&settings.lastRemindDate!==today){
    settings.lastRemindDate=today;saveSettings();
    if(Notification.permission==='granted')new Notification('📝 记账提醒',{body:settings.remindText||'别忘了记账哦～'});
    playAlarmSound();
  }
  reminders.forEach(r=>{
    if(!r.done&&r.time===cur&&r.lastTrigger!==today){
      r.lastTrigger=today;saveReminders();
      if(Notification.permission==='granted')new Notification('⏰ 任务提醒',{body:r.text});
      playAlarmSound();
      toast('⏰ '+r.text);
    }
  });
}

function init(){
  loadData();document.documentElement.setAttribute('data-theme',theme);
  renderCatGrid();renderIconPicker();renderQuickNotes();renderBalance();renderList();renderStats();renderRemind();
  if(alarmTimer)clearInterval(alarmTimer);
  alarmTimer=setInterval(checkReminders,20000);setTimeout(checkReminders,1500);
  $('themeBtn').onclick=()=>{playSound('click');const idx=THEMES.indexOf(theme);setTheme(THEMES[(idx+1)%THEMES.length]);};
  $('remindTime').addEventListener('change',e=>{settings.remindTime=e.target.value;saveSettings();toast('提醒时间已更新');});
  $('remindText').addEventListener('input',e=>{settings.remindText=e.target.value;saveSettings();});
  $('noteInput').addEventListener('input',renderQuickNotes);
}

window.switchPage=switchPage;window.openAmountSheet=openAmountSheet;window.closeAmountSheet=closeAmountSheet;window.pressKey=pressKey;window.confirmAmount=confirmAmount;window.selectCat=selectCat;window.openAddCat=openAddCat;window.closeAddCat=closeAddCat;window.saveNewCat=saveNewCat;window.pickIcon=pickIcon;window.delRecord=delRecord;window.toggleRemind=toggleRemind;window.toggleSound=toggleSound;window.toggleAlarm=toggleAlarm;window.testRemind=testRemind;window.selectQuickNote=selectQuickNote;window.openAddReminder=openAddReminder;window.closeAddReminder=closeAddReminder;window.saveNewReminder=saveNewReminder;window.toggleReminderDone=toggleReminderDone;window.delReminder=delReminder;window.selectSubCat=selectSubCat;window.closeSubCat=closeSubCat;

init();
})();
