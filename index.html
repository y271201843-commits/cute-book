<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffb6c1">
<title>迷你萌宠记账本</title>
<style>
:root{--bg:#fff5f8;--card:#fff;--text:#5a3d4a;--sub:#b3929f;--line:#ffe4e9;--primary:#ff8fab;--primary-soft:#fff0f5;--green:#34d399;--red:#f87171;--orange:#fbbf24;--radius:26px;--radius-sm:18px;--shadow:0 10px 30px rgba(255,143,171,.15);--shadow-heavy:0 14px 40px rgba(255,143,171,.25);}
[data-theme="blue"]{--bg:#f0f7ff;--card:#fff;--text:#1e293b;--sub:#94a3b8;--line:#e2e8f0;--primary:#60a5fa;--primary-soft:#eff6ff;--green:#10b981;--red:#ef4444;--orange:#f59e0b;}
[data-theme="purple"]{--bg:#f5f3ff;--card:#fff;--text:#3b0764;--sub:#c4b5fd;--line:#ede9fe;--primary:#a78bfa;--primary-soft:#f5f3ff;--green:#10b981;--red:#f43f5e;--orange:#f59e0b;}
[data-theme="dark"]{--bg:#0f0f13;--card:#1c1c1e;--text:#f2f2f7;--sub:#8e8e93;--line:#2c2c2e;--primary:#ff8fab;--primary-soft:#2c2c2e;--green:#30d158;--red:#ff453a;--orange:#ff9f0a;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;padding-bottom:calc(80px + env(safe-area-inset-bottom));transition:background .3s,color .3s;overflow-x:hidden;}
button{border:none;background:none;font-family:inherit;color:inherit;cursor:pointer;outline:none;}
input{font-family:inherit;outline:none;border:none;background:transparent;color:inherit;}
.icon-cute{width:36px;height:36px;display:flex;align-items:center;justify-content:center;transition:transform .2s;}
.icon-cute svg{width:100%;height:100%;fill:currentColor;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
@keyframes floatCute{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-5px) rotate(4deg);}}
@keyframes wiggleCute{0%,100%{transform:rotate(0deg);}25%{transform:rotate(-8deg);}75%{transform:rotate(8deg);}}
@keyframes bounceCute{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.anim-float{animation:floatCute 2.5s ease-in-out infinite;}
.anim-wiggle{animation:wiggleCute 0.5s ease-in-out infinite;}
.anim-bounce{animation:bounceCute 1.8s ease-in-out infinite;}
.hd{position:sticky;top:0;z-index:40;background:var(--bg);padding:16px 20px 10px;display:flex;justify-content:space-between;align-items:center;}
.hd h1{font-size:22px;font-weight:800;letter-spacing:-.5px;display:flex;align-items:center;gap:8px;}
.theme-btn{width:40px;height:40px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);color:var(--sub);font-size:20px;}
.theme-btn:active{transform:scale(.9) rotate(15deg);}
.main{padding:0 20px;}
.page{display:none;animation:slideUp .3s cubic-bezier(.25,.8,.25,1);}
.page.active{display:block;}
@keyframes slideUp{from{opacity:0;transform:translateY(15px);}to{opacity:1;transform:translateY(0);}}
.balance-card{background:linear-gradient(135deg,var(--primary),#ffb6c1);color:#fff;border-radius:var(--radius);padding:24px;margin-bottom:20px;box-shadow:var(--shadow-heavy);position:relative;overflow:hidden;}
[data-theme="blue"] .balance-card{background:linear-gradient(135deg,#60a5fa,#a5b4fc);}
[data-theme="purple"] .balance-card{background:linear-gradient(135deg,#a78bfa,#f0abfc);}
[data-theme="dark"] .balance-card{background:linear-gradient(135deg,#2c2c2e,#3a3a3c);}
.balance-card::after{content:"";position:absolute;right:-20px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.15);animation:floatCute 4s ease-in-out infinite;}
.balance-label{font-size:14px;opacity:.9;font-weight:600;margin-bottom:6px;}
.balance-amount{font-size:38px;font-weight:800;letter-spacing:-1px;margin-bottom:16px;}
.balance-footer{display:flex;gap:20px;font-size:13px;font-weight:600;background:rgba(255,255,255,.2);border-radius:12px;padding:8px 12px;backdrop-filter:blur(4px);}
.balance-footer span{opacity:1;display:flex;align-items:center;gap:4px;}
.section-title{font-size:15px;font-weight:700;margin:20px 0 12px;display:flex;justify-content:space-between;align-items:center;color:var(--text);}
.section-title button{font-size:12px;color:var(--primary);font-weight:700;background:var(--primary-soft);padding:6px 12px;border-radius:20px;display:flex;align-items:center;gap:4px;}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.cat-item{background:var(--card);border-radius:var(--radius-sm);padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s;border:2px solid transparent;cursor:pointer;}
.cat-item:active{transform:scale(.92);}
.cat-item.active{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 4px 15px rgba(255,143,171,.2);}
.cat-item.active .icon-cute{animation:wiggleCute 0.6s ease-in-out infinite;}
.cat-name{font-size:11px;color:var(--sub);font-weight:700;}
.rec-card{background:var(--card);border-radius:var(--radius-sm);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;transition:transform .2s;}
.rec-card:active{transform:scale(.98);}
.rec-icon{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
.rec-info{flex:1;min-width:0;}
.rec-info .name{font-size:15px;font-weight:700;}
.rec-info .note{font-size:12px;color:var(--sub);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rec-amt{font-size:17px;font-weight:800;white-space:nowrap;}
.rec-amt.exp{color:var(--red);}
.rec-amt.inc{color:var(--green);}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);}
[data-theme="dark"] .tabbar{background:rgba(28,28,30,.9);}
.tabbar button{flex:1;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--sub);font-weight:700;transition:.2s;}
.tabbar button .ico{display:flex;align-items:center;justify-content:center;opacity:.5;transition:.2s;font-size:22px;}
.tabbar button.active{color:var(--primary);}
.tabbar button.active .ico{opacity:1;transform:scale(1.15) translateY(-2px);}
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;opacity:0;pointer-events:none;transition:opacity .3s;}
.sheet-overlay.show{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:101;background:var(--card);border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .35s cubic-bezier(.25,.8,.25,1);padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto;}
.sheet.show{transform:translateY(0);}
.sheet-handle{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 16px;}
.sheet-title{font-size:18px;font-weight:800;margin-bottom:16px;text-align:center;}
.sheet-close{position:absolute;top:20px;right:20px;color:var(--sub);width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:50%;font-size:16px;}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;}
.keypad button{padding:18px 0;background:var(--bg);border-radius:12px;font-size:24px;font-weight:800;transition:background .1s,transform .1s;color:var(--text);}
.keypad button:active{background:var(--primary-soft);transform:scale(.95);}
.keypad .special{font-size:18px;font-weight:600;color:var(--sub);display:flex;align-items:center;justify-content:center;}
.keypad .confirm{background:var(--primary);color:#fff;font-size:18px;font-weight:800;}
.stats-card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow);}
.stats-row{display:flex;justify-content:space-between;margin-bottom:16px;}
.stats-item{text-align:center;flex:1;}
.stats-item .label{font-size:12px;color:var(--sub);font-weight:700;margin-bottom:6px;}
.stats-item .val{font-size:18px;font-weight:800;}
.bar-item{margin-bottom:14px;}
.bar-head{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px;}
.bar-track{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;transition:width .6s;}
.setting-item{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);}
.setting-item:last-child{border-bottom:none;}
.setting-item .lbl{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
.setting-item .desc{font-size:12px;color:var(--sub);margin-top:2px;}
.switch{width:50px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:.2s;cursor:pointer;flex-shrink:0;}
.switch.on{background:var(--primary);}
.switch::after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.2);}
.switch.on::after{left:24px;}
#toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,12px);background:var(--text);color:var(--bg);padding:10px 22px;border-radius:20px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;z-index:999;white-space:nowrap;box-shadow:0 8px 25px rgba(0,0,0,.15);}
#toast.show{opacity:1;transform:translate(-50%,0);}
.empty{text-align:center;padding:50px 0;color:var(--sub);font-size:14px;font-weight:700;}
.btn-primary{width:100%;padding:14px;border-radius:14px;background:var(--primary);color:#fff;font-size:16px;font-weight:800;margin-top:12px;box-shadow:var(--shadow);}
</style>
</head>
<body>

  <symbol id="rabbit-bus" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="3" fill="#d8b4fe"/><circle cx="8" cy="16" r="2" fill="#fff"/><circle cx="16" cy="16" r="2" fill="#fff"/><path d="M4 12h16" stroke="#fff" stroke-width="2"/></symbol>

<header class="hd">
  <h1><span class="icon-cute anim-bounce" id="headerIcon"><svg><use href="#cat-food"></use></svg></span><span id="pageTitle">记一笔</span></h1>
  <button class="theme-btn" id="themeBtn">🎨</button>
</header>

<main class="main">
  <section class="page active" id="page-add">
    <div class="balance-card" onclick="openAmountSheet()">
      <div class="balance-label">本次金额 (点击输入)</div>
      <div class="balance-amount" id="displayAmount">¥ 0.00</div>
      <div class="balance-footer">
        <span>📉 今日支出 <b id="todayExp">¥0.00</b></span>
        <span>📈 今日收入 <b id="todayInc">¥0.00</b></span>
      </div>
    </div>
    <div style="margin-bottom:16px;background:var(--card);padding:14px;border-radius:var(--radius-sm);box-shadow:var(--shadow);">
      <input type="text" id="noteInput" placeholder="输入备注（也可以直接点下方快捷备注）" style="width:100%;font-size:15px;">
    </div>
    <div class="section-title"><span>选择分类</span><button onclick="openAddCat()">➕ 自定义</button></div>
    <div class="cat-grid" id="catGrid"></div>
    <div class="section-title"><span>快捷备注</span><button onclick="openAddNote()">➕ 自定义</button></div>
    <div class="cat-grid" style="grid-template-columns:repeat(4,1fr);" id="quickNotes"></div>
  </section>

  <section class="page" id="page-list">
    <div class="balance-card" style="padding:20px;margin-bottom:16px;">
      <div class="balance-label">总资产结余</div>
      <div class="balance-amount" style="font-size:30px;" id="totalBalance">¥0.00</div>
    </div>
    <div id="recordList"></div>
  </section>

  <section class="page" id="page-stats">
    <div class="stats-card">
      <div class="stats-row">
        <div class="stats-item"><div class="label">本月收入</div><div class="val" style="color:var(--green)" id="stInc">¥0.00</div></div>
        <div class="stats-item"><div class="label">本月支出</div><div class="val" style="color:var(--red)" id="stExp">¥0.00</div></div>
        <div class="stats-item"><div class="label">本月结余</div><div class="val" style="color:var(--primary)" id="stBal">¥0.00</div></div>
      </div>
    </div>
    <div class="stats-card">
      <div class="section-title" style="margin-top:0;">支出分类排行</div>
      <div class="bar-wrap" id="rankBox"></div>
    </div>
  </section>

  <section class="page" id="page-goal">
    <div class="stats-card" style="text-align:center;padding:30px 20px;">
      <div class="icon-cute anim-float" style="font-size:60px;margin-bottom:10px;color:var(--primary);"><svg><use href="#i-target"></use></svg></div>
      <div style="font-size:18px;font-weight:800;margin-bottom:8px;">我的储蓄目标</div>
      <div style="color:var(--sub);font-size:13px;margin-bottom:16px;">为了心爱的小物件，加油攒钱吧！</div>
      <div class="bar-track" style="height:12px;"><div class="bar-fill" id="goalBar" style="width:0%;background:linear-gradient(90deg,var(--primary),#ffb6c1);"></div></div>
      <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:13px;font-weight:700;">
        <span id="goalCur">¥0</span>
        <span id="goalTotal">目标：¥0</span>
      </div>
      <div class="setting-item" style="margin-top:16px;border:none;padding:0;">
        <div class="lbl">设定目标金额</div>
        <input type="number" id="goalInput" style="text-align:right;font-size:18px;font-weight:800;width:120px;color:var(--primary);" placeholder="0">
      </div>
      <button class="btn-primary" onclick="saveGoal()">保存目标</button>
    </div>
  </section>

  <section class="page" id="page-me">
    <div class="stats-card">
      <div class="setting-item">
        <div><div class="lbl">每日提醒</div><div class="desc">到点提醒你记账</div></div>
        <div class="switch" id="remindSwitch" onclick="toggleRemind()"></div>
      </div>
      <div class="setting-item">
        <div><div class="lbl">按键音效</div><div class="desc">点击键盘的咔哒声</div></div>
        <div class="switch" id="soundSwitch" onclick="toggleSound()"></div>
      </div>
      <div class="setting-item">
        <div><div class="lbl">超支预警</div><div class="desc">超出本月预算时提醒</div></div>
        <div class="switch" id="warnSwitch" onclick="toggleWarn()"></div>
      </div>
    </div>
    <div class="stats-card">
      <div class="section-title" style="margin-top:0;">数据管理</div>
      <button class="btn-primary" style="background:var(--primary-soft);color:var(--primary);box-shadow:none;" onclick="exportData()">📤 导出数据备份</button>
      <button class="btn-primary" style="background:var(--primary-soft);color:var(--primary);box-shadow:none;margin-top:8px;" onclick="importData()">📥 导入数据恢复</button>
      <button class="btn-primary" style="background:#fff1f0;color:var(--red);box-shadow:none;margin-top:8px;" onclick="clearAllData()">🗑️ 清空所有数据</button>
    </div>
  </section>
</main>

  <div class="keypad" id="keypad">
    <button onclick="pressKey('1')">1</button><button onclick="pressKey('2')">2</button><button onclick="pressKey('3')">3</button>
    <button onclick="pressKey('4')">4</button><button onclick="pressKey('5')">5</button><button onclick="pressKey('6')">6</button>
    <button onclick="pressKey('7')">7</button><button onclick="pressKey('8')">8</button><button onclick="pressKey('9')">9</button>

  </div>
</div>

<div class="sheet-overlay" id="subCatOverlay" onclick="closeSubCat()"></div>
<div class="sheet" id="subCatSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title" id="subCatTitle">选择详细分类</div>
  <button class="sheet-close" onclick="closeSubCat()">✕</button>
  <div class="cat-grid" style="grid-template-columns:repeat(4,1fr);" id="subCatGrid"></div>
</div>

<div class="sheet-overlay" id="catOverlay" onclick="closeAddCat()"></div>
<div class="sheet" id="catSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">添加自定义分类</div>
  <button class="sheet-close" onclick="closeAddCat()">✕</button>
  <div style="display:flex;flex-direction:column;gap:12px;">
    <input type="text" id="newCatName" placeholder="分类名称 (如: 追星)" style="background:var(--bg);padding:14px;border-radius:12px;font-size:16px;font-weight:600;">

  </div>
</div>

  <div class="sheet-handle"></div>
  <div class="sheet-title">添加快捷备注</div>

  <div style="display:flex;flex-direction:column;gap:12px;">
    <input type="text" id="newNoteText" placeholder="备注标签 (如: 奶茶, 打车)" style="background:var(--bg);padding:14px;border-radius:12px;font-size:16px;font-weight:600;">
    <button class="btn-primary" onclick="saveNewNote()">✨ 保存标签</button>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
'use strict';

const THEME_ICONS = {
  pink: {food:'cat-food', drink:'cat-drink', bus:'cat-bus', shop:'cat-shop', home:'cat-shop', game:'cat-shop', book:'cat-shop', med:'cat-shop', gift:'cat-shop', pet:'cat-food', skin:'cat-shop', star:'cat-shop'},
  blue: {food:'dog-food', drink:'dog-drink', bus:'dog-bus', shop:'dog-shop', home:'dog-shop', game:'dog-shop', book:'dog-shop', med:'dog-shop', gift:'dog-shop', pet:'dog-food', skin:'dog-shop', star:'dog-shop'},
  purple: {food:'rabbit-food', drink:'rabbit-drink', bus:'rabbit-bus', shop:'rabbit-shop', home:'rabbit-shop', game:'rabbit-shop', book:'rabbit-shop', med:'rabbit-shop', gift:'rabbit-shop', pet:'rabbit-food', skin:'rabbit-shop', star:'rabbit-shop'},
  dark: {food:'panda-food', drink:'panda-drink', bus:'panda-bus', shop:'panda-shop', home:'panda-shop', game:'panda-shop', book:'panda-shop', med:'panda-shop', gift:'panda-shop', pet:'panda-food', skin:'panda-shop', star:'panda-shop'}
};

const EXPENSE_CATS=[
  {name:'餐饮', key:'food', color:'#FF8A80', subs:['早餐','午餐','晚餐','零食','外卖']},
  {name:'饮品', key:'drink', color:'#FFB74D', subs:['奶茶','咖啡','果汁','酒水']},
  {name:'交通', key:'bus', color:'#64B5F6', subs:['公交','打车','加油','停车']},
  {name:'购物', key:'shop', color:'#4DB6AC', subs:['日用品','服饰','数码','美妆']},
  {name:'居住', key:'home', color:'#BA68C8', subs:['房租','水电','物业','维修']},
  {name:'娱乐', key:'game', color:'#81C784', subs:['电影','游戏','旅游','聚会']},
  {name:'学习', key:'book', color:'#7986CB', subs:['书籍','课程','文具']},
  {name:'医疗', key:'med', color:'#E57373', subs:['药品','门诊','体检']},
  {name:'人情', key:'gift', color:'#A1887F', subs:['红包','送礼','请客']},
  {name:'宠物', key:'pet', color:'#FFD54F', subs:['猫粮','狗粮','玩具','洗澡']},
  {name:'护肤', key:'skin', color:'#F06292', subs:['水乳','面膜','彩妆']},
  {name:'其他', key:'star', color:'#A3929A', subs:['其他']}
];
const DEFAULT_INCOME=[{name:'工资',key:'wallet',color:'#00B894'},{name:'奖金',key:'star',color:'#16A34A'},{name:'兼职',key:'wallet',color:'#22C55E'},{name:'理财',key:'chart',color:'#0891B2'},{name:'红包',key:'gift',color:'#E11D48'},{name:'其他',key:'star',color:'#A3929A'}];

const DEFAULT_NOTES=['早餐','午餐','晚餐','打车','网购','奶茶','咖啡','看病','买书','看电影','送礼','工资'];
const THEMES=['pink','blue','purple','dark'];
const RK='cute_book_records_v12',SK='cute_book_settings_v12',CK='cute_book_cats_v12',NK='cute_book_notes_v12',GK='cute_book_goal_v12';
let records=[],settings={},customCats=[],quickNotes=[],theme='pink',formType='expense',formCat='餐饮',formAmount='0',currentSubCat='';
let alarmTimer=null,audioCtx=null,alarmOsc=null;

const $=id=>document.getElementById(id);
const pad2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const ym=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1);
function fmt(n){n=Number(n)||0;const neg=n<0;const s=Math.abs(n).toFixed(2);const p=s.split('.');return (neg?'-':'')+'¥'+p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',')+'.'+p[1];}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let toastTimer;
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2000);}

function playSound(type){
  if(!settings.soundOn)return;
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
    osc.connect(gain);gain.connect(audioCtx.destination);
    const now=audioCtx.currentTime;
    if(type==='key'){osc.type='sine';osc.frequency.setValueAtTime(600,now);osc.frequency.exponentialRampToValueAtTime(300,now+.05);gain.gain.setValueAtTime(.08,now);gain.gain.exponentialRampToValueAtTime(.001,now+.05);osc.start(now);osc.stop(now+.05);}
    else if(type==='save'){osc.type='triangle';osc.frequency.setValueAtTime(523.25,now);osc.frequency.setValueAtTime(659.25,now+.1);osc.frequency.setValueAtTime(783.99,now+.2);gain.gain.setValueAtTime(.12,now);gain.gain.exponentialRampToValueAtTime(.01,now+.4);osc.start(now);osc.stop(now+.4);}
    else if(type==='click'){osc.type='sine';osc.frequency.setValueAtTime(800,now);gain.gain.setValueAtTime(.05,now);gain.gain.exponentialRampToValueAtTime(.001,now+.03);osc.start(now);osc.stop(now+.03);}
  }catch(e){}
}

function loadData(){
  try{records=JSON.parse(localStorage.getItem(RK)||'[]');}catch(e){records=[];}
  try{const s=JSON.parse(localStorage.getItem(SK)||'{}');settings={remindOn:false,remindTime:'21:00',remindText:'别忘了记账哦～',lastRemindDate:'',soundOn:true,alarmOn:true,warn80:true,...s};}catch(e){settings={remindOn:false,remindTime:'21:00',remindText:'别忘了记账哦～',lastRemindDate:'',soundOn:true,alarmOn:true,warn80:true};}
  try{customCats=JSON.parse(localStorage.getItem(CK)||'[]');}catch(e){customCats=[];}
  try{quickNotes=JSON.parse(localStorage.getItem(NK)||JSON.stringify(DEFAULT_NOTES));}catch(e){quickNotes=[...DEFAULT_NOTES];}
  theme=localStorage.getItem('cute_book_theme')||'pink';
}
function saveRecords(){localStorage.setItem(RK,JSON.stringify(records));}
function saveSettings(){localStorage.setItem(SK,JSON.stringify(settings));}
function saveCustomCats(){localStorage.setItem(CK,JSON.stringify(customCats));}
function saveQuickNotes(){localStorage.setItem(NK,JSON.stringify(quickNotes));}
function setTheme(t){theme=t;document.documentElement.setAttribute('data-theme',t);localStorage.setItem('cute_book_theme',t);renderCatGrid();renderQuickNotes();renderBottomTabs();toast('主题已切换');}

function getIconId(catKey){const map=THEME_ICONS[theme]||THEME_ICONS['pink'];return map[catKey]||map['star'];}
function getCats(type){return type==='expense'?[...EXPENSE_CATS,...customCats]:DEFAULT_INCOME;}
function getCatInfo(name){const all=[...EXPENSE_CATS,...DEFAULT_INCOME,...customCats];return all.find(c=>c.name===name)||{key:'star',color:'#A3929A'};}
function monthRecords(m){return records.filter(r=>r.date.slice(0,7)===m);}
function sumBy(list,type){return list.filter(r=>r.type===type).reduce((s,r)=>s+Number(r.amount||0),0);}

function switchPage(name){
  playSound('click');
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='page-'+name));
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('active',b.dataset.page===name));
  const titles={add:'记一笔',list:'明细',stats:'统计',goal:'攒钱目标',me:'我的'};
  const titleIcon=getIconId('food');
  document.querySelector('.hd h1').innerHTML=`<span class="icon-cute anim-bounce" style="color:var(--primary);"><svg><use href="#${titleIcon}"></use></svg></span><span>${titles[name]||'迷你记账本'}</span>`;
  if(name==='list')renderList();if(name==='stats')renderStats();if(name==='goal')renderGoal();
  window.scrollTo(0,0);
}

function renderBottomTabs(){
  const tabs=document.querySelectorAll('.tabbar button');
  const keys=['walletIcon','starIcon','chartIcon','targetIcon','userIcon'];
  const fallback={walletIcon:'i-wallet',starIcon:'i-star',chartIcon:'i-chart',targetIcon:'i-target',userIcon:'i-user'};
  tabs.forEach((btn,idx)=>{
    const ico=btn.querySelector('.ico');
    if(ico&&keys[idx]){ico.innerHTML=`<svg class="icon-cute"><use href="#${fallback[keys[idx]]}"></use></svg>`;}
  });
}

function openAmountSheet(){playSound('click');$('amountOverlay').classList.add('show');$('amountSheet').classList.add('show');formAmount='0';updateSheetAmount();}
function closeAmountSheet(){$('amountOverlay').classList.remove('show');$('amountSheet').classList.remove('show');}
function updateSheetAmount(){$('sheetAmount').textContent='¥ '+formAmount;}
function pressKey(k){playSound('key');if(k==='del'){formAmount=formAmount.length>1?formAmount.slice(0,-1):'0';}else if(k==='.'){if(!formAmount.includes('.'))formAmount+='.';}else{if(formAmount==='0')formAmount=k;else formAmount+=k;}if(formAmount.length>10)formAmount=formAmount.slice(0,10);updateSheetAmount();}

function confirmAmount(){
  const v=parseFloat(formAmount)||0;
  if(v<=0){toast('请输入正确金额');return;}
  $('displayAmount').textContent=fmt(v);
  closeAmountSheet();
  saveRecord(v);
}

function renderCatGrid(){
  const currentCatList=getCats(formType);
  $('catGrid').innerHTML=currentCatList.map(c=>{
    const iconId=getIconId(c.key);const isActive=c.name===formCat;
    return `<div class="cat-item ${isActive?'active':''}" onclick="selectCat('${esc(c.name)}')"><span class="icon-cute ${isActive?'anim-wiggle':'anim-float'}" style="color:${c.color};"><svg><use href="#${iconId}"></use></svg></span><span class="cat-name">${esc(c.name)}</span></div>`;
  }).join('');
}
function selectCat(name){playSound('click');formCat=name;renderCatGrid();const cat=getCats(formType).find(c=>c.name===name);if(cat&&cat.subs&&cat.subs.length>0){currentSubCat='';$('subCatTitle').textContent=name+' - 详细分类';$('subCatGrid').innerHTML=cat.subs.map(s=>{const iconId=getIconId(cat.key);return `<div class="cat-item" onclick="selectSubCat('${esc(s)}')"><span class="icon-cute anim-float" style="color:${cat.color};"><svg><use href="#${iconId}"></use></svg></span><span class="cat-name">${esc(s)}</span></div>`;}).join('');$('subCatOverlay').classList.add('show');$('subCatSheet').classList.add('show');}}
function selectSubCat(subName){playSound('click');currentSubCat=subName;$('subCatTitle').textContent=formCat+' - '+subName;setTimeout(()=>{closeSubCat();toast('已选：'+formCat+' - '+subName);},200);}
function closeSubCat(){$('subCatOverlay').classList.remove('show');$('subCatSheet').classList.remove('show');}

function openAddCat(){playSound('click');$('catOverlay').classList.add('show');$('catSheet').classList.add('show');}
function closeAddCat(){$('catOverlay').classList.remove('show');$('catSheet').classList.remove('show');}
function saveNewCat(){const n=$('newCatName').value.trim();if(!n){toast('请输入分类名称');return;}customCats.push({name:n,key:'star',color:'#5b6ef5',subs:['其他']});saveCustomCats();renderCatGrid();closeAddCat();$('newCatName').value='';toast('分类已添加');}

function openAddNote(){playSound('click');$('noteOverlay').classList.add('show');$('noteSheet').classList.add('show');}
function closeAddNote(){$('noteOverlay').classList.remove('show');$('noteSheet').classList.remove('show');}
function saveNewNote(){const t=$('newNoteText').value.trim();if(!t){toast('请输入备注');return;}if(!quickNotes.includes(t))quickNotes.push(t);saveQuickNotes();renderQuickNotes();closeAddNote();$('newNoteText').value='';toast('标签已添加');}
function selectQuickNote(note){playSound('click');const inp=$('noteInput');if(inp.value===note){inp.value='';toast('已取消备注');}else{inp.value=note;toast('已选备注：'+note);}renderQuickNotes();}
function renderQuickNotes(){const noteVal=$('noteInput')?$('noteInput').value:'';const iconId=getIconId('star');$('quickNotes').innerHTML=quickNotes.map(n=>`<div class="cat-item ${n===noteVal?'active':''}" onclick="selectQuickNote('${esc(n)}')" style="padding:10px 4px;"><span class="icon-cute ${n===noteVal?'anim-wiggle':'anim-float'}" style="color:var(--primary);font-size:22px;"><svg><use href="#${iconId}"></use></svg></span><span class="cat-name" style="font-size:10px;">${esc(n)}</span></div>`).join('');}

function saveRecord(amountParam){
  const v = amountParam || parseFloat(formAmount) || 0;
  if(v<=0){toast('请先输入金额');return;}
  const date=ymd(new Date());const note=$('noteInput').value.trim();const displayCat=currentSubCat?formCat+'/'+currentSubCat:formCat;
  records.push({id:genId(),date,type:formType,category:displayCat,amount:Math.round(v*100)/100,note,createdAt:Date.now()});
  saveRecords();playSound('save');toast('✨ 已记一笔 '+fmt(v));
  formAmount='0';$('displayAmount').textContent='¥ 0.00';$('noteInput').value='';currentSubCat='';
  renderQuickNotes();renderList();renderStats();renderBalance();renderGoal();
}

function renderBalance(){const m=ym(new Date());const list=monthRecords(m);$('totalBalance').textContent=fmt(sumBy(list,'income')-sumBy(list,'expense'));const today=ymd(new Date());const tl=records.filter(r=>r.date===today);$('todayExp').textContent=fmt(sumBy(tl,'expense'));$('todayInc').textContent=fmt(sumBy(tl,'income'));}

function renderList(){
  const list=records.slice().sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt));
  if(!list.length){const emptyIcon=getIconId('food');$('recordList').innerHTML=`<div class="empty"><span class="icon-cute anim-bounce" style="font-size:50px;opacity:0.3;color:var(--primary);"><svg><use href="#${emptyIcon}"></use></svg></span><br>还没有记录</div>`;return;}
  const groups={};list.forEach(r=>{(groups[r.date]=groups[r.date]||[]).push(r);});
  let html='';Object.keys(groups).sort((a,b)=>b.localeCompare(a)).forEach(date=>{const items=groups[date];html+=`<div style="font-size:12px;color:var(--sub);font-weight:700;margin:16px 0 8px;padding-left:4px;">${date}</div>`;items.forEach(r=>{const catName=r.category.split('/')[0];const info=getCatInfo(catName);const sign=r.type==='expense'?'-':'+';const iconId=getIconId(info.key);html+=`<div class="rec-card"><div class="rec-icon" style="background:${info.color}20;color:${info.color}"><span class="icon-cute" style="width:24px;height:24px;"><svg><use href="#${iconId}"></use></svg></span></div><div class="rec-info"><div class="name">${esc(r.category)}</div>${r.note?`<div class="note">${esc(r.note)}</div>`:''}</div><div class="rec-amt ${r.type==='expense'?'exp':'inc'}">${sign}${fmt(r.amount)}</div><button onclick="delRecord('${r.id}')" style="color:var(--sub);padding:8px;"><span class="icon-cute" style="width:18px;height:18px;opacity:0.5;"><svg><use href="#i-close"></use></svg></span></button></div>`;});});
  $('recordList').innerHTML=html;
}
function delRecord(id){if(!confirm('确定删除？'))return;records=records.filter(r=>r.id!==id);saveRecords();renderList();renderStats();renderBalance();renderGoal();}

function renderStats(){
  const m=ym(new Date());const list=monthRecords(m);const inc=sumBy(list,'income'),exp=sumBy(list,'expense'),bal=inc-exp;
  $('stInc').textContent=fmt(inc);$('stExp').textContent=fmt(exp);$('stBal').textContent=fmt(bal);
  const map={};list.filter(r=>r.type==='expense').forEach(r=>{const mainCat=r.category.split('/')[0];map[mainCat]=(map[mainCat]||0)+Number(r.amount);});
  const arr=Object.entries(map).sort((a,b)=>b[1]-a[1]);const total=arr.reduce((s,x)=>s+x[1],0);const box=$('rankBox');
  if(!arr.length){box.innerHTML='<div class="empty" style="padding:20px 0">本月还没有支出</div>';}else{box.innerHTML=arr.map(([cat,amt])=>{const pct=total>0?(amt/total*100):0;const info=getCatInfo(cat);const iconId=getIconId(info.key);return `<div class="bar-item"><div class="bar-head"><span style="display:flex;align-items:center;gap:6px;font-size:15px;"><span class="icon-cute" style="width:20px;height:20px;color:${info.color};"><svg><use href="#${iconId}"></use></svg></span>${esc(cat)}<span style="font-size:11px;color:var(--sub);background:var(--bg);padding:2px 6px;border-radius:6px;">${pct.toFixed(1)}%</span></span><span style="color:var(--red)">${fmt(amt)}</span></div><div class="bar-track"><div class="bar-fill" style="width:${pct.toFixed(1)}%;background:${info.color}"></div></div></div>`;}).join('');}
}

function renderGoal(){const goal=parseFloat(localStorage.getItem(GK))||0;const m=ym(new Date());const bal=sumBy(monthRecords(m),'income')-sumBy(monthRecords(m),'expense');const cur=Math.max(0,bal);$('goalInput').value=goal||'';$('goalCur').textContent=fmt(cur);$('goalTotal').textContent='目标：'+fmt(goal);const pct=goal>0?Math.min(100,(cur/goal*100)):0;$('goalBar').style.width=pct+'%';}
function saveGoal(){const g=parseFloat($('goalInput').value)||0;localStorage.setItem(GK,g);renderGoal();toast('目标已更新');}

function exportData(){const data={records,customCats,quickNotes,settings,goal:localStorage.getItem(GK)};const blob=new Blob([JSON.stringify(data)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='cute_book_backup.json';a.click();URL.revokeObjectURL(url);toast('备份已导出');}
function importData(){const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=e=>{const reader=new FileReader();reader.onload=ev=>{try{const data=JSON.parse(ev.target.result);if(!confirm('导入将覆盖当前数据，确定吗？'))return;records=data.records||[];customCats=data.customCats||[];quickNotes=data.quickNotes||[...DEFAULT_NOTES];settings=Object.assign({},settings,data.settings);if(data.goal)localStorage.setItem(GK,data.goal);saveRecords();saveCustomCats();saveQuickNotes();saveSettings();init();toast('导入成功！');}catch(err){toast('文件格式错误');}};reader.readAsText(e.target.files[0]);};inp.click();}
function clearAllData(){if(!confirm('确定清空所有记录吗？'))return;records=[];saveRecords();renderList();renderStats();renderBalance();renderGoal();toast('数据已清空');}

function init(){
  loadData();document.documentElement.setAttribute('data-theme',theme);
