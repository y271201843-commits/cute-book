<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>喵喵记账</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  background-color: #fff5f8;
  padding-bottom: 90px;
  color: #333;
}

/* 顶部栏 */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: #fff5f8;
  padding: 18px 20px 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.topbar-title {
  display: flex;
  align-items: center;
  gap:8px;
  font-size:20px;
  font-weight:800;
  color:#442233;
}
.topbar-title svg{
  width:28px;
  height:28px;
}
.voice-icon{
  width:36px;
  height:36px;
  border-radius:50%;
  background:#ffffff;
  box-shadow:0 3px 10px #00000015;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* 备注输入框 */
.remark-input-wrap{
  margin:12px 20px 20px;
  background:#ffffff;
  border-radius:16px;
  padding:14px 16px;
  display:flex;
  gap:8px;
  align-items:center;
  box-shadow:0 4px 14px #0000000c;
}
.remark-input-wrap svg{
  width:20px;
  height:20px;
}
#topRemark{
  flex:1;
  border:none;
  outline:none;
  font-size:16px;
  background:transparent;
}

.section-title{
  padding:0 20px 10px;
  display:flex;
  justify-content:space-between;
  color:#442233;
  font-weight:700;
  font-size:16px;
}
.section-title .tip{
  color:#999;
  font-weight:normal;
  font-size:14px;
}

/* 分类网格，和截图一模一样布局：4列卡片图标 */
.cate-grid{
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap:14px;
  padding:0 20px 24px;
}
.cate-item{
  background:#ffffff;
  border-radius:18px;
  padding:16px 8px 10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  box-shadow:0 3px 10px #00000008;
  cursor:pointer;
  border:2px solid transparent;
  transition:0.2s;
}
.cate-item.selected{
  border-color:#ff94b8;
  background:#fff0f4;
}
.cate-icon{
  width:48px;
  height:48px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.cate-icon svg{
  width:26px;
  height:26px;
}
.cate-name{
  font-size:13px;
  color:#444;
}

/* 快捷备注区 */
.fast-grid{
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap:14px;
  padding:0 20px 24px;
}
.fast-item{
  background:#ffffff;
  border-radius:18px;
  padding:14px 6px 8px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  box-shadow:0 3px 10px #00000008;
  cursor:pointer;
}
.fast-icon{
  width:42px;
  height:42px;
  border-radius:12px;
}
.fast-name{
  font-size:13px;
}

/* 页面切换 */
.page { display: none; }
.page.active { display: block; }

/* 明细页面 */
.list-page-wrap{
  padding:16px 20px;
}
.export-btn{
  width:100%;
  padding:14px;
  background:#ff8fab;
  color:white;
  border-radius:14px;
  text-align:center;
  font-weight:700;
  margin-bottom:16px;
  cursor:pointer;
}
.rec-item {
  display: flex;
  justify-content: space-between;
  padding: 13px 0;
  border-bottom: 1px solid #f0f0f0;
}
.rec-item:last-child { border-bottom: none; }
.rec-title { font-weight: 700; }
.rec-sub { font-size: 12px; color: #999; margin-top: 4px; }
.rec-amt-out { color: #ff6b6b; font-weight: 800; }
.rec-amt-in { color: #28b968; font-weight: 800; }

/* 底部tab导航，和截图一致 */
.tab-bar {
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  background:#ffffff;
  border-top:1px solid #eee;
  padding-bottom: env(safe-area-inset-bottom);
}
.tab {
  flex:1;
  text-align:center;
  padding:10px 0;
  font-size:12px;
  cursor:pointer;
  color:#888;
}
.tab.active{
  color:#ff6b6b;
}
.tab-icon{
  font-size:22px;
  display:block;
  margin-bottom:3px;
}

/* Toast反馈，去掉记账成功老文字 */
#toast {
  position:fixed;
  left:50%;
  bottom:120px;
  transform:translate(-50%, 20px);
  background:rgba(45,42,50,.92);
  color:#fff;
  padding:10px 16px;
  border-radius:999px;
  font-size:13px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:200;
}
#toast.show { opacity:1; transform:translate(-50%, 0); }
</style>
</head>
<body>

<!-- 记一笔页面 -->
<div id="page-add" class="page active">
  <div class="topbar">
    <div class="topbar-title">
      <svg viewBox="0 0 24 24" fill="#442233"><path d="M8 5c0-1.7 1.3-3 3-3s3 1.3 3 3c0 .4-.1.8-.2 1.1L16 11h-1l-1.5-3h-3L9 11H8l2.2-4.9C9.1 5.7 8 5.4 8 5z"/><path d="M6 13c-1.1 0-2 .9-2 2v4c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-4c0-1.1-.9-2-2-2H6z"/></svg>
      记一笔
    </div>
    <div class="voice-icon">🔊</div>
  </div>

  <div class="remark-input-wrap">
    <svg viewBox="0 0 24 24" fill="#ff94b8"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
    <input id="topRemark" placeholder="火锅，打车">
  </div>

  <div class="section-title">
    <span>选择分类</span>
    <span class="tip">点一个对应萌宠</span>
  </div>
  <div class="cate-grid" id="cateContainer"></div>

  <div class="section-title">
    <span>快捷备注</span>
    <span class="tip">点了也能继续改文字</span>
  </div>
  <div class="fast-grid" id="fastContainer"></div>

</div>

<!-- 账单明细页面（新增导出按钮） -->
<div id="page-list" class="page">
  <div class="topbar">
    <div class="topbar-title">账单明细</div>
  </div>
  <div class="list-page-wrap">
    <div class="export-btn" onclick="exportBill()">📄 导出全部账单</div>
    <div id="recordList"></div>
  </div>
</div>

<!-- 统计页面 -->
<div id="page-stats" class="page">
  <div class="topbar">
    <div class="topbar-title">数据统计</div>
  </div>
  <div class="list-page-wrap">
    <div style="background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;">
      <div style="font-size:14px;color:#888;margin-bottom:8px;">累计支出</div>
      <div style="font-size:32px;font-weight:800;color:#ff6b6b;" id="statExp">¥0.00</div>
    </div>
    <div style="background:#fff;border-radius:16px;padding:20px;">
      <div style="font-size:14px;color:#888;margin-bottom:8px;">累计收入</div>
      <div style="font-size:32px;font-weight:800;color:#28b968;" id="statInc">¥0.00</div>
    </div>
  </div>
</div>

<!-- 底部导航 -->
<div class="tab-bar">
  <div class="tab active" onclick="switchPage('add', this)">
    <span class="tab-icon">🖊️</span>记一笔
  </div>
  <div class="tab" onclick="switchPage('list', this)">
    <span class="tab-icon">🗓️</span>日历
  </div>
  <div class="tab" onclick="switchPage('stats', this)">
    <span class="tab-icon">📝</span>备忘录
  </div>
  <div class="tab">
    <span class="tab-icon">👤</span>我的
  </div>
</div>

<div id="toast"></div>

<script>
let records = JSON.parse(localStorage.getItem('myRecords')) || [];
let currentCate = "饮品";

// 分类图标库
const cateList = [
  {name:"餐饮",bg:"#ffb74d",svg:`<svg viewBox="0 0 24 24" fill="#fff"><path d="M8 2h8l-1 9h-6L8 2z"/><path d="M7 13h10v3a3 3 0 0 1-3 3h-4a3 3 0 0 1-3-3v-3z"/></svg>`},
  {name:"饮品",bg:"#b06fe3",svg:`<svg viewBox="0 0 24 24" fill="#fff"><path d="M7 3h10l-1 13a3 3 0 0 1-3 3h-2a3 3 0 0 1-3-3L7 3z"/></svg>`},
  {name:"交通",bg:"#42a5f5",svg:`<svg viewBox="0 0 24 24" fill="#fff"><path d="M3 12l2-5a2 2 0 0 1 2-1h10a2 2 0 0 1 2 1l2 5v4H3v-4z"/></svg>`},
  {name:"购物",bg:"#66bb6a",svg:`<svg viewBox="0 0 24 24" fill="#fff"><path d="M4 6h16l-1 12H5L4 6z"/></svg>`},
  {name:"居住",bg:"#ef5350",svg:`<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3L4 10v9h16v-9l-8-7z"/></svg>`},
  {name:"娱乐",bg:"#7e57c2",svg:`<svg viewBox="0 0 24 24" fill="#fff"><rect x="4" y="7" width="16" height="10" rx="2"/></svg>`},
  {name:"学习",bg:"#26a69a",svg:`<svg viewBox="0 0 24 24" fill="#fff"><path d="M5 4h10a3 3 0 0 1 3 3v11H8a3 3 0 0 1-3-3V4z"/></svg>`},
  {name:"医疗",bg:"#78909c",svg:`<svg viewBox="0 0 24 24" fill="#fff"><path d="M4 11h16v6a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-6z"/></svg>`},
  {name:"人情",bg:"#ef5350",svg:`<svg viewBox="0 0 24 24" fill="#fff"><path d="M4 9h16v11H4V9z"/></svg>`},
  {name:"宠物",bg:"#424242",svg:`<svg viewBox="0 0 24 24" fill="#fff"><path d="M6 10c0-2 2-4 4-4h4c2 0 4 2 4 4v7H6v-7z"/></svg>`},
  {name:"护肤",bg:"#ec407a",svg:`<svg viewBox="0 0 24 24" fill="#fff"><path d="M9 3h6l-1 6h-4L9 3z"/></svg>`},
  {name:"其他",bg:"#b0bec5",svg:`<svg viewBox="0 0 24 24" fill="#fff"><circle cx="7" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="17" cy="12" r="1.8"/></svg>`}
];

const fastList = [
  {name:"早餐",bg:"#ffcc80"},
  {name:"午餐",bg:"#81d4fa"},
  {name:"晚餐",bg:"#7986cb"},
  {name:"火锅",bg:"#ef9a9a"}
];

function $(id){return document.getElementById(id);}

//渲染分类
function renderCate(){
  $('cateContainer').innerHTML = cateList.map(item=>`
    <div class="cate-item ${item.name===currentCate?'selected':''}" onclick="selectCate('${item.name}')">
      <div class="cate-icon" style="background:${item.bg}">${item.svg}</div>
      <div class="cate-name">${item.name}</div>
    </div>
  `).join('');
}
function selectCate(name){
  currentCate = name;
  renderCate();
}

//快捷备注渲染
function renderFast(){
  $('fastContainer').innerHTML = fastList.map(item=>`
    <div class="fast-item" onclick="applyFastNote('${item.name}')">
      <div class="fast-icon" style="background:${item.bg}"></div>
      <div class="fast-name">${item.name}</div>
    </div>
  `).join('');
}
function applyFastNote(text){
  $('topRemark').value = text;
}

//页面切换
function switchPage(pageName,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  $('page-'+pageName).classList.add('active');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(el) el.classList.add('active');
  if(pageName==='list') renderList();
  if(pageName==='stats') renderStats();
}

//账单渲染
function renderList(){
  if(records.length ===0){
    $('recordList').innerHTML = '<div style="text-align:center;color:#999;padding:20px;">暂无账单记录</div>';
    return;
  }
  $('recordList').innerHTML = records.slice().reverse().map(r=>`
    <div class="rec-item">
      <div>
        <div class="rec-title">${r.category}</div>
        <div class="rec-sub">${r.date} ${r.note ? '· ' + r.note : ''}</div>
      </div>
      <div class="${r.type==='exp'?'rec-amt-out':'rec-amt-in'}">${r.type==='exp'?'-':'+'}¥${r.amount.toFixed(2)}</div>
    </div>
  `).join('');
}

//统计页面
function renderStats(){
  const totalExp = records.filter(r=>r.type==='exp').reduce((s,r)=>s+r.amount,0);
  const totalInc = records.filter(r=>r.type==='inc').reduce((s,r)=>s+r.amount,0);
  $('statExp').textContent = '¥' + totalExp.toFixed(2);
  $('statInc').textContent = '¥' + totalInc.toFixed(2);
}

// ==========【重点】导出账单CSV功能 ==========
function exportBill(){
  if(records.length === 0){
    showToast('暂无账单可以导出');
    return;
  }
  //表头
  const header = ["日期","收支类型","分类","金额","备注"];
  const rows = records.map(r=>{
    const typeText = r.type === 'exp' ? '支出' : '收入';
    return [r.date, typeText, r.category, r.amount, r.note];
  })
  let csvContent = "\uFEFF"; //BOM解决Excel中文乱码
  csvContent += header.join(",") + "\n";
  rows.forEach(row=>{
    csvContent += row.join(",") + "\n";
  })
  const blob = new Blob([csvContent], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `喵喵记账账单_${new Date().toLocaleDateString()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('账单文件已下载');
}

function showToast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1600);
}

//初始化
renderCate();
renderFast();
</script>
</body>
</html>
