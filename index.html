<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffb6c1">
<title>迷你萌宠记账本</title>
<style>
:root{
  --bg:#fff5f8;
  --card:#fff;
  --text:#5a3d4a;
  --sub:#b3929f;
  --line:#ffe4e9;
  --primary:#ff8fab;
  --primary-soft:#fff0f5;
  --green:#34d399;
  --red:#f87171;
  --orange:#fbbf24;
  --radius:26px;
  --radius-sm:18px;
  --shadow:0 10px 30px rgba(255,143,171,.15);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:15px;
  line-height:1.5;
  padding-bottom:calc(90px + env(safe-area-inset-bottom));
}
button{border:none;background:none;font-family:inherit;color:inherit;cursor:pointer;outline:none;}
input,textarea{font-family:inherit;outline:none;border:none;background:transparent;color:inherit;}
img{display:block;max-width:100%;}

/* ===== 通用动画 ===== */
@keyframes floatCute{
  0%,100%{transform:translateY(0) rotate(0deg);}
  50%{transform:translateY(-6px) rotate(4deg);}
}
@keyframes bounceCute{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-8px);}
}
@keyframes wiggleCute{
  0%,100%{transform:rotate(-3deg);}
  50%{transform:rotate(3deg);}
}
.anim-float{animation:floatCute 2.5s ease-in-out infinite;}
.anim-bounce{animation:bounceCute 1.8s ease-in-out infinite;}

/* ===== 顶部栏 ===== */
.hd{
  position:sticky;
  top:0;
  z-index:40;
  background:var(--bg);
  padding:16px 20px 10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.hd h1{
  font-size:22px;
  font-weight:800;
  display:flex;
  align-items:center;
  gap:8px;
}
.hd .logo-img{
  width:34px;
  height:34px;
  border-radius:12px;
}
.theme-btn{
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--card);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:var(--shadow);
  font-size:20px;
  transition:transform .2s;
}
.theme-btn:active{transform:scale(0.92);}

/* ===== 主体 ===== */
.main{padding:0 20px;}
.page{display:none;}
.page.active{display:block;}

/* ===== 金额卡片 ===== */
.balance-card{
  background:linear-gradient(135deg,#ff8fab,#ffb6c1);
  color:#fff;
  border-radius:var(--radius);
  padding:24px;
  margin-bottom:16px;
  box-shadow:0 10px 30px rgba(255,143,171,.18);
  position:relative;
  overflow:hidden;
}
.balance-card::before{
  content:"";
  position:absolute;
  right:-40px;
  top:-40px;
  width:140px;
  height:140px;
  background:rgba(255,255,255,.18);
  border-radius:50%;
}
.balance-label{font-size:14px;opacity:.9;font-weight:600;margin-bottom:6px;}
.balance-amount{font-size:40px;font-weight:800;margin-bottom:14px;}
.balance-footer{
  display:flex;
  gap:14px;
  font-size:13px;
  font-weight:700;
  background:rgba(255,255,255,.22);
  border-radius:14px;
  padding:10px 12px;
}
.balance-footer .item{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.balance-footer .label{opacity:.9;font-size:12px;}
.balance-footer .val{font-size:18px;}

/* ===== 自由输入区 ===== */
.note-input-card{
  background:var(--card);
  border-radius:var(--radius-sm);
  padding:14px;
  margin-bottom:16px;
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  gap:10px;
}
.note-input-card .pencil{
  width:34px;
  height:34px;
  border-radius:12px;
  background:var(--primary-soft);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  flex-shrink:0;
}
.note-input-card textarea{
  flex:1;
  font-size:15px;
  color:var(--text);
  resize:none;
  line-height:1.4;
  max-height:80px;
}
.note-input-card textarea::placeholder{color:var(--sub);}

/* ===== 区块标题 ===== */
.section-title{
  font-size:15px;
  font-weight:800;
  margin:18px 0 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.section-title .sub{font-size:12px;color:var(--sub);font-weight:600;}
.section-title button{
  font-size:12px;
  color:var(--primary);
  font-weight:800;
  background:var(--primary-soft);
  padding:6px 12px;
  border-radius:20px;
}

/* ===== 分类网格 / 快捷标签 ===== */
.cat-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}
.cat-item{
  background:var(--card);
  border-radius:var(--radius-sm);
  padding:12px 6px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  box-shadow:var(--shadow);
  border:2px solid transparent;
  cursor:pointer;
  transition:transform .15s, border-color .2s, background .2s;
}
.cat-item:active{transform:scale(0.94);}
.cat-item.active{
  border-color:var(--primary);
  background:var(--primary-soft);
}
.cat-item.active .mini-img{animation:wiggleCute .6s ease-in-out infinite;}
.mini-img{
  width:42px;
  height:42px;
  border-radius:14px;
  object-fit:cover;
  background:var(--primary-soft);
}
.cat-name{font-size:11px;color:var(--sub);font-weight:700;}

/* ===== 明细记录卡片 ===== */
.rec-card{
  background:var(--card);
  border-radius:var(--radius-sm);
  padding:14px;
  margin-bottom:12px;
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  gap:12px;
}
.rec-icon{
  width:48px;
  height:48px;
  border-radius:14px;
  overflow:hidden;
  background:var(--primary-soft);
  flex-shrink:0;
}
.rec-icon img{width:100%;height:100%;object-fit:cover;}
.rec-info{flex:1;min-width:0;}
.rec-info .row1{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.rec-info .name{font-size:15px;font-weight:800;}
.rec-info .note{
  font-size:12px;
  color:var(--sub);
  margin-top:4px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.rec-amt{font-size:17px;font-weight:800;white-space:nowrap;}
.rec-amt.exp{color:var(--red);}
.rec-date{font-size:11px;color:var(--sub);margin-top:4px;}

/* ===== 底部导航 ===== */
.tabbar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:60;
  display:flex;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  flex:1;
  padding:10px 0 8px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  font-size:11px;
  color:var(--sub);
  font-weight:800;
  transition:.2s;
}
.tabbar button .ico{
  width:28px;
  height:28px;
  opacity:.5;
  transition:.2s;
}
.tabbar button.active{color:var(--primary);}
.tabbar button.active .ico{opacity:1;transform:scale(1.15);}

/* ===== 弹窗 ===== */
.sheet{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:101;
  background:var(--card);
  border-radius:28px 28px 0 0;
  transform:translateY(100%);
  transition:transform .35s cubic-bezier(.25,.8,.25,1);
  padding:20px 20px calc(20px + env(safe-area-inset-bottom));
  max-height:80vh;
  overflow-y:auto;
}
.sheet.show{transform:translateY(0);}
.sheet-handle{
  width:40px;
  height:5px;
  border-radius:3px;
  background:var(--line);
  margin:0 auto 16px;
}
.sheet-title{
  font-size:18px;
  font-weight:800;
  margin-bottom:16px;
  text-align:center;
}
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  z-index:100;
  opacity:0;
  pointer-events:none;
  transition:opacity .3s;
}
.overlay.show{opacity:1;pointer-events:auto;}

/* ===== 数字键盘 ===== */
.keypad{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:16px;
}
.keypad button{
  padding:18px 0;
  background:var(--bg);
  border-radius:14px;
  font-size:24px;
  font-weight:800;
  transition:transform .15s;
}
.keypad button:active{transform:scale(0.94);}
.keypad .confirm{
  background:var(--primary);
  color:#fff;
  font-size:17px;
}

/* ===== 按钮 ===== */
.btn-primary{
  width:100%;
  padding:14px;
  border-radius:14px;
  background:var(--primary);
  color:#fff;
  font-size:16px;
  font-weight:800;
  margin-top:12px;
}
.btn-primary:active{transform:scale(0.98);}

/* ===== 我的页面 / 提醒页面 ===== */
.me-card{
  background:var(--card);
  border-radius:24px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}
.me-list{display:flex;flex-direction:column;gap:4px;}
.me-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 12px;
  border-radius:16px;
  background:var(--bg);
  margin-bottom:8px;
}
.me-item .left{display:flex;align-items:center;gap:12px;}
.me-item .icon-box{
  width:40px;
  height:40px;
  border-radius:14px;
  background:var(--primary-soft);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}
.me-item .title{font-size:15px;font-weight:800;}
.me-item .desc{font-size:12px;color:var(--sub);margin-top:2px;}

/* 开关 */
.switch{
  width:50px;
  height:28px;
  border-radius:14px;
  background:#ffe4e9;
  position:relative;
  cursor:pointer;
  transition:.3s;
}
.switch.active{background:var(--primary);}
.switch-dot{
  width:24px;
  height:24px;
  background:#fff;
  border-radius:50%;
  position:absolute;
  top:2px;
  left:2px;
  transition:.3s;
  box-shadow:0 2px 6px rgba(0,0,0,.15);
}
.switch.active .switch-dot{left:24px;}

/* 提醒详情页 */
.remind-card{
  background:var(--card);
  border-radius:24px;
  padding:20px;
  box-shadow:var(--shadow);
}
.remind-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
  border-bottom:1px dashed var(--line);
}
.remind-row:last-child{border-bottom:none;}
.remind-row .label{font-weight:800;font-size:15px;}
.remind-row .value{color:var(--sub);font-size:14px;}
.time-picker{
  background:var(--primary-soft);
  color:var(--text);
  font-weight:800;
  padding:8px 14px;
  border-radius:12px;
}

/* Toast */
#toast{
  position:fixed;
  left:50%;
  bottom:110px;
  transform:translate(-50%,12px);
  background:#5a3d4a;
  color:#fff;
  padding:10px 22px;
  border-radius:20px;
  font-size:13px;
  font-weight:800;
  opacity:0;
  transition:.3s;
  z-index:999;
  white-space:nowrap;
}
</style>
</head>
<body>

<header class="hd">
  <h1>
    <img class="logo-img anim-bounce" id="headerLogo" src="https://img.icons8.com/color/96/cat--v1.png" alt="logo">
    <span>萌宠记账本</span>
  </h1>
  <div style="display:flex;gap:8px;">
    <button class="theme-btn" id="soundToggleBtn" onclick="toggleSound()">🔊</button>
    <button class="theme-btn" onclick="alert('皮肤切换已加载')">🎨</button>
  </div>
</header>

<main class="main">

  <!-- 记一笔 -->
  <section class="page active" id="page-add">
    <div class="balance-card" onclick="openAmountSheet()">
      <div class="balance-label">本次金额（点击输入）</div>
      <div class="balance-amount" id="displayAmount">¥ 0.00</div>
      <div class="balance-footer">
        <div class="item">
          <span class="label">今日支出</span>
          <span class="val" id="todayExp">¥0.00</span>
        </div>
        <div class="item">
          <span class="label">今日收入</span>
          <span class="val" id="todayInc">¥0.00</span>
        </div>
      </div>
    </div>

    <div class="note-input-card">
      <div class="pencil">✏️</div>
      <textarea id="noteInput" rows="1" placeholder="写点什么，比如：今天吃了火锅、打车回家、买了新衣服……"></textarea>
    </div>

    <div class="section-title">
      <span>选择分类</span>
      <span class="sub">点一个对应萌宠</span>
    </div>
    <div class="cat-grid" id="catGrid"></div>

    <div class="section-title">
      <span>快捷备注</span>
      <span class="sub">点了也能继续改文字</span>
    </div>
    <div class="cat-grid" id="quickNotes"></div>
  </section>

  <!-- 明细 -->
  <section class="page" id="page-list">
    <div class="balance-card" style="padding:20px;margin-bottom:16px;">
      <div class="balance-label">累计结余</div>
      <div class="balance-amount" style="font-size:30px;" id="totalBalance">¥0.00</div>
    </div>
    <div id="recordList"></div>
  </section>

  <!-- 统计 -->
  <section class="page" id="page-stats">
    <div class="me-card">
      <div class="section-title"><span>本月统计</span></div>
      <div class="remind-row">
        <span class="label">本月收入</span>
        <span class="value" id="stInc">¥0.00</span>
      </div>
      <div class="remind-row">
        <span class="label">本月支出</span>
        <span class="value" id="stExp">¥0.00</span>
      </div>
      <div class="remind-row">
        <span class="label">本月结余</span>
        <span class="value" id="stBal">¥0.00</span>
      </div>
    </div>
  </section>

  <!-- 我的 -->
  <section class="page" id="page-me">
    <div class="me-card">
      <div class="section-title"><span>我的设置</span></div>
      <div class="me-item">
        <div class="left">
          <div class="icon-box">🔊</div>
          <div>
            <div class="title">音效开关</div>
            <div class="desc">按键音、确认音、提醒音</div>
          </div>
        </div>
        <div class="switch" id="soundSwitch" onclick="toggleSound()">
          <div class="switch-dot"></div>
        </div>
      </div>

      <div class="me-item" onclick="openRemindPage()">
        <div class="left">
          <div class="icon-box">⏰</div>
          <div>
            <div class="title">每日提醒</div>
            <div class="desc" id="remindDesc">设置记账时间与重复方式</div>
          </div>
        </div>
        <span style="color:var(--primary);font-weight:800;">›</span>
      </div>
    </div>
  </section>

  <!-- 每日提醒详情页 -->
  <section class="page" id="page-remind">
    <div class="remind-card">
      <div class="section-title">
        <span>⏰ 每日提醒</span>
      </div>

      <div class="remind-row">
        <span class="label">开启提醒</span>
        <div class="switch" id="remindSwitch" onclick="toggleRemind()">
          <div class="switch-dot"></div>
        </div>
      </div>

      <div class="remind-row">
        <span class="label">提醒时间</span>
        <input type="time" class="time-picker" id="remindTime" value="20:00">
      </div>

      <div class="remind-row">
        <span class="label">提醒内容</span>
        <input type="text" class="time-picker" id="remindText" placeholder="写一句提醒自己" value="该记账啦，今天花了多少？">
      </div>

      <div class="remind-row">
        <span class="label">重复</span>
        <span class="value">每天</span>
      </div>

      <div class="remind-row">
        <span class="label">提前预览音效</span>
        <button class="time-picker" onclick="playAlarmSound()">🔔 播放闹钟声</button>
      </div>

      <button class="btn-primary" onclick="saveRemind()">保存提醒设置</button>
    </div>
  </section>

</main>

<!-- 底部导航 -->
<nav class="tabbar" id="tabbar">
  <button data-page="add" class="active" onclick="switchPage('add')">
    <img class="ico" src="https://img.icons8.com/color/96/pencil--v1.png">
    <span>记一笔</span>
  </button>
  <button data-page="list" onclick="switchPage('list')">
    <img class="ico" src="https://img.icons8.com/color/96/notes.png">
    <span>明细</span>
  </button>
  <button data-page="stats" onclick="switchPage('stats')">
    <img class="ico" src="https://img.icons8.com/color/96/combo-chart.png">
    <span>统计</span>
  </button>
  <button data-page="me" onclick="switchPage('me')">
    <img class="ico" src="https://img.icons8.com/color/96/user-male-circle.png">
    <span>我的</span>
  </button>
</nav>

<!-- 金额输入弹窗 -->
<div class="overlay" id="amountOverlay" onclick="closeAmountSheet()"></div>
<div class="sheet" id="amountSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">输入金额</div>
  <div style="text-align:center;font-size:44px;font-weight:800;color:#ff8fab;margin:16px 0 8px;" id="sheetAmount">¥ 0.00</div>
  <div class="keypad">
    <button onclick="pressKey('1');playKeypadSound()">1</button>
    <button onclick="pressKey('2');playKeypadSound()">2</button>
    <button onclick="pressKey('3');playKeypadSound()">3</button>
    <button onclick="pressKey('4');playKeypadSound()">4</button>
    <button onclick="pressKey('5');playKeypadSound()">5</button>
    <button onclick="pressKey('6');playKeypadSound()">6</button>
    <button onclick="pressKey('7');playKeypadSound()">7</button>
    <button onclick="pressKey('8');playKeypadSound()">8</button>
    <button onclick="pressKey('9');playKeypadSound()">9</button>
    <button onclick="pressKey('.');playKeypadSound()">.</button>
    <button onclick="pressKey('0');playKeypadSound()">0</button>
    <button onclick="pressKey('del');playKeypadSound()">⌫</button>
    <button class="confirm" style="grid-column:span 3;" onclick="confirmAmount()">确定保存</button>
  </div>
</div>

<div id="toast"></div>

<script>
// ===================== 音效系统 =====================
let audioCtx = null;
function initAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}
function playKeypadSound(){
  if(!soundOn) return;
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(720, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.07);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.07);
}
function playConfirmSound(){
  if(!soundOn) return;
  initAudio();
  [520,780].forEach((f,i)=>{
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(f, audioCtx.currentTime + i*0.08);
    gain.gain.setValueAtTime(0.06, audioCtx.currentTime + i*0.08);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i*0.08 + 0.12);
    osc.start(audioCtx.currentTime + i*0.08);
    osc.stop(audioCtx.currentTime + i*0.08 + 0.12);
  });
}
function playSwitchSound(){
  if(!soundOn) return;
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(440, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.1);
}
function playAlarmSound(){
  if(!soundOn) return;
  initAudio();
  let t = audioCtx.currentTime;
  for(let i=0;i<6;i++){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'square';
    osc.frequency.setValueAtTime(900, t + i*0.25);
    gain.gain.setValueAtTime(0.04, t + i*0.25);
    gain.gain.exponentialRampToValueAtTime(0.001, t + i*0.25 + 0.18);
    osc.start(t + i*0.25);
    osc.stop(t + i*0.25 + 0.18);
  }
}

let records = JSON.parse(localStorage.getItem('records') || '[]');
let customCats = [];
let selectedCatIndex = 0;
let formAmount = '0';
let soundOn = localStorage.getItem('soundOn') !== 'off';

function $(id){return document.getElementById(id);}
function fmt(n){return '¥'+Number(n||0).toFixed(2);}
function toast(msg){
  const t=$('toast');
  t.textContent=msg;
  t.style.opacity='1';
  t.style.transform='translate(-50%,0)';
  setTimeout(()=>{
    t.style.opacity='0';
    t.style.transform='translate(-50%,12px)';
  },1800);
}

// ===================== 页面切换 =====================
function switchPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.remove('active'));
  document.querySelector('.tabbar button[data-page="'+name+'"]').classList.add('active');

  const titles = {add:'记一笔',list:'明细',stats:'统计',me:'我的',remind:'每日提醒'};
  document.querySelector('.hd h1 span').textContent = titles[name] || '萌宠记账本';

  if(name==='list') renderList();
  if(name==='stats') renderStats();
}

// ===================== 音效开关 =====================
function toggleSound(){
  playSwitchSound();
  soundOn = !soundOn;
  localStorage.setItem('soundOn', soundOn ? 'on' : 'off');
  renderSoundIcon();
  toast(soundOn ? '音效已开启' : '音效已关闭');
}
function renderSoundIcon(){
  const btn = $('soundToggleBtn');
  const sw = $('soundSwitch');
  if(soundOn){
    btn.textContent = '🔊';
    sw.classList.add('active');
  }else{
    btn.textContent = '🔇';
    sw.classList.remove('active');
  }
}

// ===================== 金额输入 =====================
function openAmountSheet(){
  $('amountOverlay').classList.add('show');
  $('amountSheet').classList.add('show');
  formAmount = '0';
  $('sheetAmount').textContent = '¥ 0.00';
}
function closeAmountSheet(){
  $('amountOverlay').classList.remove('show');
  $('amountSheet').classList.remove('show');
}
function pressKey(k){
  if(k==='del'){
    formAmount = formAmount.length>1 ? formAmount.slice(0,-1) : '0';
  }else if(k==='.'){
    if(!formAmount.includes('.')) formAmount += '.';
  }else{
    formAmount = formAmount==='0' ? k : formAmount + k;
  }
  $('sheetAmount').textContent = '¥ ' + formAmount;
}
function confirmAmount(){
  const v = parseFloat(formAmount) || 0;
  if(v<=0){toast('请输入金额');return;}
  $('displayAmount').textContent = fmt(v);
  closeAmountSheet();
  playConfirmSound();
  setTimeout(()=>saveRecord(v),200);
}

// ===================== 保存记录 =====================
function saveRecord(v){
  const note = $('noteInput').value.trim();
  const nowCat = catList[selectedCatIndex];

  records.push({
    id: Date.now(),
    date: new Date().toLocaleDateString('zh-CN'),
    time: new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),
    type: 'expense',
    amount: v,
    category: nowCat.name,
    catImg: nowCat.img,
    note: note || '未填写备注'
  });

  localStorage.setItem('records', JSON.stringify(records));
  toast('已保存 '+fmt(v));

  $('noteInput').value = '';
  calcToday();
  renderList();
  renderStats();
  $('displayAmount').textContent = '¥ 0.00';
}

// ===================== 今日统计 =====================
function calcToday(){
  const today = new Date().toLocaleDateString('zh-CN');
  let exp=0, inc=0;
  records.forEach(r=>{
    if(r.date===today){
      if(r.type==='expense') exp += Number(r.amount);
      else inc += Number(r.amount);
    }
  });
  $('todayExp').textContent = fmt(exp);
  $('todayInc').textContent = fmt(inc);
}

// ===================== 渲染分类 =====================
function renderCatGrid(){
  const box = $('catGrid');
  box.innerHTML = catList.map((c,i)=>`
    <div class="cat-item ${i===selectedCatIndex?'active':''}" onclick="selectCat(${i})">
      <img class="mini-img" src="${c.img}" alt="${c.name}">
      <span class="cat-name">${c.name}</span>
    </div>
  `).join('');
}
function selectCat(i){
  playSwitchSound();
  selectedCatIndex = i;
  renderCatGrid();
  toast('已选分类：'+catList[i].name);
}

// ===================== 快捷备注 =====================
function renderQuickNotes(){
  $('quickNotes').innerHTML = quickNoteList.map(n=>`
    <div class="cat-item" onclick="fillQuickNote('${n.name}')">
      <img class="mini-img" src="${n.img}" alt="${n.name}">
      <span class="cat-name">${n.name}</span>
    </div>
  `).join('');
}
function fillQuickNote(name){
  const input = $('noteInput');
  if(input.value.trim()){
    input.value = input.value + '，' + name;
  }else{
    input.value = name;
  }
  playSwitchSound();
  toast('已添加：'+name);
}

// ===================== 明细列表 =====================
function renderList(){
  const box = $('recordList');
  if(!records.length){
    box.innerHTML = '<div style="text-align:center;padding:40px;color:var(--sub);">还没有记录哦 🐣</div>';
    $('totalBalance').textContent = '¥0.00';
    return;
  }

  let html = '';
  let total = 0;
  records.slice().reverse().forEach(r=>{
    total += r.type==='expense' ? -Number(r.amount) : Number(r.amount);
    html += `
      <div class="rec-card">
        <div class="rec-icon">
          <img src="${r.catImg}" alt="${r.category}">
        </div>
        <div class="rec-info">
          <div class="row1">
            <span class="name">${r.category}</span>
            <span class="rec-amt ${r.type==='expense'?'exp':'inc'}">${r.type==='expense'?'-':'+'}${fmt(r.amount)}</span>
          </div>
          <div class="note">${r.note}</div>
          <div class="rec-date">${r.date} ${r.time||''}</div>
        </div>
      </div>
    `;
  });

  box.innerHTML = html;
  $('totalBalance').textContent = fmt(total);
}

// ===================== 统计 =====================
function renderStats(){
  const now = new Date().toLocaleDateString('zh-CN');
  let exp=0, inc=0;
  records.forEach(r=>{
    if(r.date===now){
      if(r.type==='expense') exp += Number(r.amount);
      else inc += Number(r.amount);
    }
  });
  $('stExp').textContent = fmt(exp);
  $('stInc').textContent = fmt(inc);
  $('stBal').textContent = fmt(inc - exp);
}

// ===================== 每日提醒页 =====================
function openRemindPage(){
  switchPage('remind');
}
function toggleRemind(){
  playSwitchSound();
  const sw = $('remindSwitch');
  const isOn = !sw.classList.contains('active');
  if(isOn){
    sw.classList.add('active');
    localStorage.setItem('remindSwitch','on');
    toast('已开启每日提醒');
  }else{
    sw.classList.remove('active');
    localStorage.setItem('remindSwitch','off');
    toast('已关闭每日提醒');
  }
  updateRemindDesc();
}
function updateRemindDesc(){
  const on = localStorage.getItem('remindSwitch') === 'on';
  const time = localStorage.getItem('remindTime') || '20:00';
  $('remindDesc').textContent = on ? '每日 '+time+' 提醒记账' : '设置记账时间与重复方式';
}
function saveRemind(){
  playConfirmSound();
  const time = $('remindTime').value || '20:00';
  const text = $('remindText').value.trim() || '该记账啦';
  localStorage.setItem('remindTime', time);
  localStorage.setItem('remindText', text);
  updateRemindDesc();
  toast('提醒设置已保存');
}

// ===================== 初始化 =====================
renderCatGrid();
renderQuickNotes();
renderList();
renderStats();
calcToday();
renderSoundIcon();
updateRemindDesc();

$('remindTime').value = localStorage.getItem('remindTime') || '20:00';
$('remindText').value = localStorage.getItem('remindText') || '该记账啦，今天花了多少？';
if(localStorage.getItem('remindSwitch') === 'on'){
  $('remindSwitch').classList.add('active');
}
</script>
