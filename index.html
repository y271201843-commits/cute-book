<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喵喵记账</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #f7f8fa; padding-bottom: 80px; color: #333; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: #fff; }
        .header-title { font-size: 18px; font-weight: 600; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background-color: #e8edf5; display:flex; align-items:center; justify-content:center; font-size:18px; }
        
        /* 页面显示控制 */
        .page { display: none; }
        .page.active { display: block; }

        /* 记一笔页面 */
        .amount-card { margin:16px 20px; background:#ffffff; border-radius:16px; padding:24px 20px; }
        .amount-label { color:#888; font-size:14px; }
        .amount-input { font-size:36px; font-weight:bold; margin-top:8px; border:none; outline:none; width:100%; }
        .type-switch { display:flex; margin:0 20px 16px; background:#fff; border-radius:12px; overflow:hidden; }
        .type-item { flex:1; text-align:center; padding:12px; cursor:pointer; font-weight:bold; color:#666;}
        .type-item.active.exp { background:#ff6b6b; color:white; }
        .type-item.active.inc { background:#28b968; color:white; }
        .container { margin:0 20px; background:#fff; border-radius:16px; padding:16px; }
        .item-row { margin-bottom:16px; }
        .row-title { font-size:15px; margin-bottom:10px; font-weight:bold;}
        .remark-input { width:100%; border:1px solid #eee; border-radius:8px; padding:12px; outline:none; background: #fafafa;}
        .cate-grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:12px; margin-top:10px; }
        .cate-item { display:flex; flex-direction:column; align-items:center; padding:8px 4px; border-radius:10px; background:#f8f9fa; cursor:pointer; border: 2px solid transparent;}
        .cate-item.selected { border-color: #ff6b6b; background: #fff0f0; }
        .cate-icon-box { width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center; margin-bottom:4px; font-size: 20px;}
        .cate-name { font-size:12px; color:#444; font-weight: bold;}
        
        /* 保存按钮 */
        .save-btn { margin: 20px; width: calc(100% - 40px); padding: 16px; background: #ff6b6b; color: white; font-size: 16px; font-weight: bold; border-radius: 12px; border: none; cursor: pointer; }

        /* 明细与统计页面 */
        .list-card { margin:16px 20px; background:#fff; border-radius:16px; padding:16px; }
        .rec-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
        .rec-item:last-child { border-bottom: none; }
        .rec-title { font-weight: bold; }
        .rec-sub { font-size: 12px; color: #999; margin-top: 4px; }
        .rec-amt-out { color: #ff6b6b; font-weight: bold; }
        .rec-amt-in { color: #28b968; font-weight: bold; }

        /* 底部导航 */
        .tab-bar { position:fixed; bottom:0; width:100%; display:flex; background:#fff; border-top:1px solid #eee; padding-bottom: env(safe-area-inset-bottom); }
        .tab { flex:1; text-align:center; padding:10px 0; font-size:12px; cursor:pointer; color: #888; font-weight: bold; }
        .tab.active { color: #ff6b6b; }
        .tab-icon { font-size: 20px; display: block; margin-bottom: 2px; }
    </style>
</head>
<body>
    <!-- 页面1：记一笔 -->
    <div id="page-add" class="page active">
        <div class="header">
            <div class="header-title">记一笔</div>
            <div class="avatar">🐱</div>
        </div>
        <div class="amount-card">
            <div class="amount-label">金额</div>
            <input class="amount-input" id="amountInput" type="number" placeholder="0.00">
        </div>
        <div class="type-switch">
            <div class="type-item active exp" id="typeExp" onclick="switchType('exp')">支出</div>
            <div class="type-item" id="typeInc" onclick="switchType('inc')">收入</div>
        </div>
        <div class="container">
            <div class="item-row">
                <div class="row-title">备注</div>
                <input class="remark-input" id="noteInput" placeholder="填写备注信息，如：午餐">
            </div>
            <div class="item-row">
                <div class="row-title">分类</div>
                <div class="cate-grid" id="cateContainer"></div>
            </div>
        </div>
        <button class="save-btn" onclick="saveRecord()">保存这笔记录</button>
    </div>

    <!-- 页面2：明细 -->
    <div id="page-list" class="page">
        <div class="header"><div class="header-title">账单明细</div></div>
        <div class="list-card" id="recordList"></div>
    </div>

    <!-- 页面3：统计 -->
    <div id="page-stats" class="page">
        <div class="header"><div class="header-title">数据统计</div></div>
        <div class="list-card">
            <div style="font-size: 14px; color: #888; margin-bottom: 8px;">累计支出</div>
            <div style="font-size: 32px; font-weight: bold; color: #ff6b6b;" id="statExp">¥0.00</div>
        </div>
        <div class="list-card">
            <div style="font-size: 14px; color: #888; margin-bottom: 8px;">累计收入</div>
            <div style="font-size: 32px; font-weight: bold; color: #28b968;" id="statInc">¥0.00</div>
        </div>
    </div>

    <!-- 底部导航 -->
    <div class="tab-bar">
        <div class="tab active" onclick="switchPage('add', this)"><span class="tab-icon">✏️</span>记一笔</div>
        <div class="tab" onclick="switchPage('list', this)"><span class="tab-icon">📋</span>明细</div>
        <div class="tab" onclick="switchPage('stats', this)"><span class="tab-icon">📊</span>统计</div>
    </div>

<script>
    // 核心数据存储
    let records = JSON.parse(localStorage.getItem('myRecords')) || [];
    let currentType = 'exp'; // exp 或 inc
    let currentCate = '餐饮';

    const CATS = [
        {name:'餐饮', icon:'🍔'}, {name:'交通', icon:'🚗'}, {name:'购物', icon:'🛍️'}, 
        {name:'医疗', icon:'💊'}, {name:'居住', icon:'🏠'}, {name:'娱乐', icon:'🎮'}, 
        {name:'学习', icon:'📚'}, {name:'工资', icon:'💰'}, {name:'其他', icon:'🌟'}
    ];

    function $(id) { return document.getElementById(id); }

    // 切换收入/支出
    function switchType(type) {
        currentType = type;
        if(type === 'exp') {
            $('typeExp').classList.add('active', 'exp');
            $('typeInc').classList.remove('active', 'inc');
        } else {
            $('typeInc').classList.add('active', 'inc');
            $('typeExp').classList.remove('active', 'exp');
        }
    }

    // 渲染分类
    function renderCats() {
        $('cateContainer').innerHTML = CATS.map(c => `
            <div class="cate-item ${c.name === currentCate ? 'selected' : ''}" onclick="selectCate('${c.name}')">
                <div class="cate-icon-box">${c.icon}</div>
                <div class="cate-name">${c.name}</div>
            </div>
        `).join('');
    }

    function selectCate(name) {
        currentCate = name;
        renderCats();
    }

    // 保存记录（核心功能）
    function saveRecord() {
        const amount = parseFloat($('amountInput').value);
        const note = $('noteInput').value.trim();
        
        if (!amount || amount <= 0) {
            alert('请输入正确的金额');
            return;
        }

        const newRecord = {
            id: Date.now(),
            type: currentType,
            amount: amount,
            category: currentCate,
            note: note,
            date: new Date().toLocaleDateString('zh-CN')
        };

        records.push(newRecord);
        localStorage.setItem('myRecords', JSON.stringify(records));
        
        // 清空输入框
        $('amountInput').value = '';
        $('noteInput').value = '';
        
        alert('✅ 记账成功！');
        renderList();
        renderStats();
    }

    // 渲染明细
    function renderList() {
        if (records.length === 0) {
            $('recordList').innerHTML = '<div style="text-align:center;color:#999;padding:20px;">还没有记录哦</div>';
            return;
        }
        $('recordList').innerHTML = records.slice().reverse().map(r => `
            <div class="rec-item">
                <div>
                    <div class="rec-title">${r.category}</div>
                    <div class="rec-sub">${r.date} ${r.note ? '· ' + r.note : ''}</div>
                </div>
                <div class="${r.type === 'exp' ? 'rec-amt-out' : 'rec-amt-in'}">
                    ${r.type === 'exp' ? '-' : '+'}¥${r.amount.toFixed(2)}
                </div>
            </div>
        `).join('');
    }

    // 渲染统计
    function renderStats() {
        const totalExp = records.filter(r => r.type === 'exp').reduce((s, r) => s + r.amount, 0);
        const totalInc = records.filter(r => r.type === 'inc').reduce((s, r) => s + r.amount, 0);
        $('statExp').textContent = '¥' + totalExp.toFixed(2);
        $('statInc').textContent = '¥' + totalInc.toFixed(2);
    }

    // 页面切换
    function switchPage(pageName, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        $('page-' + pageName).classList.add('active');
        
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');

        if (pageName === 'list') renderList();
        if (pageName === 'stats') renderStats();
        window.scrollTo(0,0);
    }

    // 初始化
    renderCats();
    renderList();
    renderStats();
</script>
</body>
</html>
